  function render(keepScroll = false) {
    const prevScroll = keepScroll ? (app.querySelector('main')?.scrollTop || 0) : 0;
    const views = {
      home: homeView,
      routines: routinesView,
      workout: workoutView,
      progress: progressView,
      profile: profileView,
      exercises: exercisesView,
      'exercise-detail': exerciseDetailView,
      import: importView
    };
    app.innerHTML = (views[state.screen] || homeView)();
    bind();
    const m = app.querySelector('main');
    if (m) m.scrollTop = keepScroll ? prevScroll : 0;
  }

  function bind() {
    app.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => {
      state.screen = b.dataset.nav;
      save();
      render(false);
    }));
    app.querySelectorAll('[data-pick-home]').forEach(b => b.addEventListener('click', () => {
      ui.homeRoutineId = b.dataset.pickHome;
      render(true);
    }));
    app.querySelectorAll('[data-start]').forEach(b => b.addEventListener('click', () => startSession(b.dataset.start)));
    app.querySelectorAll('[data-action]').forEach(b => b.addEventListener('click', () => action(b.dataset.action)));

    // Apertura scheda singolo esercizio
    app.querySelectorAll('[data-open-ex]').forEach(el => el.addEventListener('click', () => {
      ui.prevScreenForEx = state.screen;
      ui.selectedExercise = el.dataset.openEx;
      state.screen = 'exercise-detail';
      render(false);
    }));

    // Routine editor
    app.querySelectorAll('[data-toggle-edit]').forEach(b => b.addEventListener('click', () => {
      const id = b.dataset.toggleEdit;
      ui.editingRoutine = ui.editingRoutine === id ? null : id;
      render(true);
    }));
    app.querySelectorAll('[data-del-routine-ex]').forEach(b => b.addEventListener('click', () => {
      const [id, idx] = b.dataset.delRoutineEx.split(':');
      const r = state.routines.find(x => x.id === id);
      if (!r) return;
      if (r.exercises.length <= 1) { toast('Lascia almeno un esercizio nella scheda'); return; }
      r.exercises.splice(Number(idx), 1);
      save(); render(true);
    }));
    app.querySelectorAll('[data-add-routine-ex]').forEach(b => b.addEventListener('click', () => {
      const id = b.dataset.addRoutineEx;
      const inp = app.querySelector(`#add-routine-input-${id}`);
      const val = inp?.value.trim();
      if (!val) { toast('Scrivi il nome dell’esercizio'); inp?.focus(); return; }
      const r = state.routines.find(x => x.id === id);
      if (r) { r.exercises.push(val); save(); render(true); toast('Aggiunto alla scheda'); }
    }));
    app.querySelectorAll('[data-delete-routine]').forEach(b => b.addEventListener('click', () => {
      const id = b.dataset.deleteRoutine;
      if (!confirm('Eliminare questa scheda?')) return;
      state.routines = state.routines.filter(r => r.id !== id);
      ui.editingRoutine = null;
      save(); render(true);
    }));

    // Workout controls
    app.querySelectorAll('[data-rest]').forEach(b => b.addEventListener('click', () => startRestTimer(Number(b.dataset.rest))));
    app.querySelectorAll('[data-save-ex]').forEach(b => b.addEventListener('click', () => saveSingleExercise(Number(b.dataset.saveEx))));
    app.querySelectorAll('[data-add-set]').forEach(b => b.addEventListener('click', () => {
      const ei = Number(b.dataset.addSet);
      state.session.exercises[ei].sets.push({ kg: '', reps: '' });
      state.session.exercises[ei].saved = false;
      save(); render(true);
    }));
    app.querySelectorAll('[data-remove-set]').forEach(b => b.addEventListener('click', () => {
      const [ei, si] = b.dataset.removeSet.split('-').map(Number);
      const sets = state.session.exercises[ei].sets;
      if (sets.length <= 1) { toast('Lascia almeno una serie per esercizio'); return; }
      sets.splice(si, 1);
      state.session.exercises[ei].saved = false;
      save(); render(true);
    }));
    app.querySelectorAll('[data-remove-ex]').forEach(b => b.addEventListener('click', () => {
      const ei = Number(b.dataset.removeEx);
      state.session.exercises.splice(ei, 1);
      syncSessionToHistory();
      save(); render(true);
    }));
    app.querySelectorAll('input[data-ex]').forEach(input => input.addEventListener('input', () => {
      const ei = Number(input.dataset.ex), si = Number(input.dataset.set), field = input.dataset.field;
      state.session.exercises[ei].sets[si][field] = input.value;
      state.session.exercises[ei].saved = false;
      const btn = app.querySelector(`[data-save-ex="${ei}"]`);
      if (btn) { btn.classList.remove('done'); btn.textContent = '✓ Salva'; }
      app.querySelector(`[data-ex-card="${ei}"]`)?.classList.remove('is-saved');
      save();
      if (field === 'reps') updateDeltas(ei);
    }));
    app.querySelector('#new-exercise')?.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); addExercise(); }
    });

    // Grafici & Storico
    app.querySelectorAll('[data-muscle]').forEach(b => b.addEventListener('click', () => {
      ui.muscle = b.dataset.muscle; ui.exerciseFilter = 'all'; ui.chartPoint = null; render(true);
    }));
    app.querySelector('#exercise-filter')?.addEventListener('change', e => {
      ui.exerciseFilter = e.target.value; ui.chartPoint = null; render(true);
    });
    app.querySelectorAll('[data-metric]').forEach(b => b.addEventListener('click', () => { ui.metric = b.dataset.metric; render(true); }));
    app.querySelectorAll('[data-chart-pt]').forEach(g => g.addEventListener('click', () => { ui.chartPoint = Number(g.dataset.chartPt); render(true); }));
    app.querySelectorAll('[data-delete-session]').forEach(b => b.addEventListener('click', () => {
      const id = b.dataset.deleteSession;
      if (!confirm('Eliminare questa seduta dallo storico?')) return;
      state.history = state.history.filter(s => s.id !== id);
      save(); render(true); toast('Seduta eliminata');
    }));

    // Archivio & Scheda Singolo Esercizio
    app.querySelector('#ex-search-input')?.addEventListener('input', e => {
      ui.exSearch = e.target.value;
      render(true);
      const inp = app.querySelector('#ex-search-input');
      if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
    });
    app.querySelector('#ex-group-select')?.addEventListener('change', e => {
      if (!ui.selectedExercise) return;
      state.exerciseGroups[ui.selectedExercise.trim().toLowerCase()] = e.target.value;
      save(); toast('Gruppo muscolare aggiornato');
    });
    app.querySelectorAll('[data-del-ex-entry]').forEach(b => b.addEventListener('click', () => {
      const [sid, exIdx] = b.dataset.delExEntry.split(':');
      if (!confirm('Rimuovere questa registrazione?')) return;
      const s = state.history.find(x => x.id === sid);
      if (s) {
        s.exercises.splice(Number(exIdx), 1);
        if (!s.exercises.length) state.history = state.history.filter(x => x.id !== sid);
        save(); render(true); toast('Voce rimossa');
      }
    }));

    // Importazione passati
    app.querySelectorAll('[data-import-tab]').forEach(b => b.addEventListener('click', () => {
      ui.importTab = b.dataset.importTab; render(true);
    }));
    app.querySelector('#note-import-text')?.addEventListener('input', e => { ui.noteText = e.target.value; });
    app.querySelector('#manual-date')?.addEventListener('change', e => { ui.manualDate = e.target.value; });
    app.querySelector('#manual-routine')?.addEventListener('change', e => { ui.manualRoutineId = e.target.value; ui.manualSets = {}; render(true); });
    app.querySelectorAll('[data-m-ex]').forEach(inp => inp.addEventListener('input', () => {
      const name = inp.dataset.mEx, si = Number(inp.dataset.mSet), field = inp.dataset.mField;
      if (!ui.manualSets[name]) ui.manualSets[name] = [{ kg: '', reps: '' }, { kg: '', reps: '' }];
      ui.manualSets[name][si][field] = inp.value;
    }));

    app.querySelector('#import-file')?.addEventListener('change', importBackup);
  }

  function startRestTimer(sec) {
    clearInterval(restTimerInterval);
    ui.restOpen = false;
    if (sec <= 0) {
      restSecondsLeft = 0;
      render(true);
      return;
    }
    restSecondsLeft = sec;
    render(true);
    restTimerInterval = setInterval(() => {
      restSecondsLeft--;
      const el = document.getElementById('timer-display');
      if (restSecondsLeft <= 0) {
        clearInterval(restTimerInterval);
        restSecondsLeft = 0;
        if (el) { el.classList.remove('running'); el.textContent = '⏱ Recupero'; }
        toast('Recupero terminato!');
        if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
      } else if (el) {
        el.classList.add('running');
        el.textContent = `⏱ ${formatTimer(restSecondsLeft)}`;
      }
    }, 1000);
  }

  function updateDeltas(ei) {
    const ex = state.session.exercises[ei];
    const prev = lastForExercise(ex.name, state.session.id)?.sets || [];
    ex.sets.forEach((set, si) => {
      const el = app.querySelector(`[data-delta="${ei}-${si}"]`);
      if (!el) return;
      const c = repsChange(set.reps, prev[si]?.reps);
      el.className = `change-mark ${c.cls}`;
      el.textContent = c.label;
    });
  }

  // Sincronizza subito gli esercizi salvati nella history così non si perdono mai
  function syncSessionToHistory(includeAllFilled = false) {
    if (!state.session) return 0;
    const exercises = state.session.exercises
      .filter(e => includeAllFilled ? e.sets.some(s => String(s.reps).trim() !== '') : e.saved)
      .map(e => ({
        name: e.name,
        sets: e.sets
          .filter(s => String(s.reps).trim() !== '')
          .map(s => ({ kg: String(s.kg).trim() === '' ? null : Number(s.kg), reps: Number(s.reps) }))
      }))
      .filter(e => e.sets.length > 0);

    const existingIdx = state.history.findIndex(h => h.id === state.session.id);
    if (!exercises.length) {
      if (existingIdx >= 0) state.history.splice(existingIdx, 1);
      return 0;
    }
    const record = {
      id: state.session.id,
      routineId: state.session.routineId,
      routineName: state.session.routineName,
      date: state.session.date,
      startedAt: state.session.startedAt,
      finishedAt: new Date().toISOString(),
      exercises
    };
    if (existingIdx >= 0) state.history[existingIdx] = record;
    else state.history.push(record);
    return exercises.length;
  }

  function saveSingleExercise(ei) {
    const ex = state.session?.exercises?.[ei];
    if (!ex) return;
    const validSets = ex.sets.filter(s => String(s.reps).trim() !== '');
    if (!validSets.length) {
      toast('Inserisci almeno le ripetizioni di una serie');
      return;
    }
    ex.saved = true;
    syncSessionToHistory(false);
    save();
    render(true);
    toast(`${ex.name} memorizzato ✓`);
  }

  function startSession(routineId) {
    if (state.session) {
      if (state.session.routineId === routineId) {
        state.screen = 'workout';
        save();
        render(false);
        return;
      }
      if (!confirm(`Hai già "${state.session.routineName}" in corso. Gli esercizi su cui hai premuto "✓ Salva" resteranno salvati. Vuoi iniziare comunque una nuova scheda?`)) {
        return;
      }
    }
    const r = state.routines.find(x => x.id === routineId);
    if (!r) { toast('Scheda non trovata'); return; }
    state.session = {
      id: uid(),
      routineId: r.id,
      routineName: r.name,
      date: today(),
      startedAt: new Date().toISOString(),
      exercises: r.exercises.map(name => {
        const previous = lastForExercise(name);
        return {
          name,
          saved: false,
          sets: previous?.sets?.length
            ? previous.sets.map(s => ({ kg: s.kg == null ? '' : String(s.kg), reps: String(s.reps ?? '') }))
            : [{ kg: '', reps: '' }, { kg: '', reps: '' }]
        };
      })
    };
    state.screen = 'workout';
    save();
    render(false);
  }

  function addExercise() {
    const input = app.querySelector('#new-exercise');
    const name = input?.value.trim();
    if (!name) { toast('Scrivi il nome dell’esercizio'); input?.focus(); return; }
    if (state.session.exercises.some(e => e.name.toLowerCase() === name.toLowerCase())) {
      toast('Questo esercizio è già nella seduta'); return;
    }
    const prev = lastForExercise(name, state.session.id);
    state.session.exercises.push({
      name,
      saved: false,
      sets: prev?.sets?.length
        ? prev.sets.map(s => ({ kg: s.kg == null ? '' : String(s.kg), reps: String(s.reps ?? '') }))
        : [{ kg: '', reps: '' }, { kg: '', reps: '' }]
    });
    save(); render(true); toast('Esercizio aggiunto per oggi');
  }

  function action(name) {
    if (name === 'resume-session') { state.screen = 'workout'; save(); render(false); return; }
    if (name === 'open-exercises') { state.screen = 'exercises'; render(false); return; }
    if (name === 'open-import') { state.screen = 'import'; render(false); return; }
    if (name === 'back-from-ex') { state.screen = ui.prevScreenForEx || 'exercises'; render(false); return; }
    if (name === 'toggle-add-routine') { ui.addingRoutine = !ui.addingRoutine; render(true); return; }
    if (name === 'create-routine') {
      const val = app.querySelector('#new-routine-name')?.value.trim();
      if (!val) { toast('Scrivi il nome della scheda'); return; }
      state.routines.push({ id: 'r-' + uid(), name: val, tag: 'SCHEDA PERSONALIZZATA', exercises: ['Esercizio 1'] });
      ui.addingRoutine = false;
      save(); render(true); toast('Scheda creata'); return;
    }
    if (name === 'add-exercise') { addExercise(); return; }
    if (name === 'toggle-rest') { ui.restOpen = !ui.restOpen; render(true); return; }
    if (name === 'cancel-session') {
      if (confirm('Chiudere la sessione attiva? Gli esercizi già salvati con "✓ Salva" restano comunque nello storico.')) {
        clearInterval(restTimerInterval); restSecondsLeft = 0;
        state.session = null; state.screen = 'home'; save(); render(false);
      }
      return;
    }
    if (name === 'save-session') {
      const count = syncSessionToHistory(true);
      if (!count) { toast('Inserisci almeno una serie con le ripetizioni'); return; }
      clearInterval(restTimerInterval); restSecondsLeft = 0;
      state.session = null; state.screen = 'home'; save(); render(false);
      toast(`Allenamento completato (${count} esercizi) ✓`);
      return;
    }
    if (name === 'save-ex-update') {
      const exName = ui.selectedExercise;
      const d = app.querySelector('#ex-upd-date')?.value || today();
      const sets = [0, 1].map(i => ({
        kg: app.querySelector(`#ex-upd-kg-${i}`)?.value.trim(),
        reps: app.querySelector(`#ex-upd-rep-${i}`)?.value.trim()
      })).filter(s => s.reps !== '').map(s => ({ kg: s.kg === '' ? null : Number(s.kg), reps: Number(s.reps) }));
      if (!sets.length) { toast('Inserisci almeno le ripetizioni della Serie I'); return; }
      state.history.push({
        id: 'upd-' + uid(),
        routineId: 'manual',
        routineName: 'Aggiornamento Carico',
        date: d,
        finishedAt: new Date().toISOString(),
        exercises: [{ name: exName, sets }]
      });
      save(); render(true); toast('Nuovo carico registrato ✓');
      return;
    }
    if (name === 'parse-note') {
      if (!ui.noteText.trim()) { toast('Incolla prima il testo della nota'); return; }
      ui.parsedNoteSessions = parseNoteText(ui.noteText);
      render(true);
      return;
    }
    if (name === 'confirm-note-import') {
      if (!ui.parsedNoteSessions?.length) return;
      state.history.push(...ui.parsedNoteSessions);
      const n = ui.parsedNoteSessions.length;
      ui.parsedNoteSessions = null; ui.noteText = '';
      state.screen = 'progress';
      save(); render(false);
      toast(`${n} sedute importate nei grafici ✓`);
      return;
    }
    if (name === 'save-manual-session') {
      const r = state.routines.find(x => x.id === ui.manualRoutineId) || state.routines[0];
      const d = app.querySelector('#manual-date')?.value || ui.manualDate || today();
      const exercises = r.exercises.map(exName => {
        const raw = ui.manualSets[exName] || [];
        const sets = raw.filter(s => String(s.reps).trim() !== '').map(s => ({
          kg: String(s.kg).trim() === '' ? null : Number(s.kg),
          reps: Number(s.reps)
        }));
        return { name: exName, sets };
      }).filter(e => e.sets.length > 0);
      if (!exercises.length) { toast('Compila almeno un esercizio con le ripetizioni'); return; }
      state.history.push({
        id: 'man-' + uid(),
        routineId: r.id,
        routineName: r.name,
        date: d,
        finishedAt: new Date().toISOString(),
        exercises
      });
      ui.manualSets = {};
      state.screen = 'progress';
      save(); render(false);
      toast('Seduta passata salvata ✓');
      return;
    }
    if (name === 'goal-up') { state.goal = Math.min(7, state.goal + 1); save(); render(true); return; }
    if (name === 'goal-down') { state.goal = Math.max(1, state.goal - 1); save(); render(true); return; }
    if (name === 'export') { exportBackup(); return; }
    if (name === 'import') { app.querySelector('#import-file')?.click(); return; }
    if (name === 'load-demo') { loadDemoData(); return; }
    if (name === 'clear-demo') {
      state.history = state.history.filter(s => !s.isDemo);
      ui.chartPoint = null; save(); render(true); toast('Dati di prova rimossi'); return;
    }
    if (name === 'reset-routines') {
      if (confirm('Ripristinare le 4 schede base (Push / Pull / Leg / Upper)?')) {
        state.routines = JSON.parse(JSON.stringify(DEFAULT_ROUTINES));
        ui.editingRoutine = null; save(); render(true); toast('Schede ripristinate');
      }
      return;
    }
  }

  function loadDemoData() {
    const daysAgo = n => {
      const d = new Date(); d.setDate(d.getDate() - n);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };
    const demo = [
      { id: 'demo1', isDemo: true, routineId: 'push', routineName: 'Push Day', date: daysAgo(14), finishedAt: 'T18:00', exercises: [{ name: 'Pec deck', sets: [{ kg: 55, reps: 10 }, { kg: 55, reps: 9 }] }, { name: 'Panca inclinata', sets: [{ kg: 60, reps: 8 }, { kg: 60, reps: 8 }] }, { name: 'Triceps push down', sets: [{ kg: 30, reps: 12 }, { kg: 30, reps: 10 }] }] },
      { id: 'demo2', isDemo: true, routineId: 'pull', routineName: 'Pull Day', date: daysAgo(12), finishedAt: 'T18:00', exercises: [{ name: 'Lat machine', sets: [{ kg: 60, reps: 10 }, { kg: 60, reps: 9 }] }, { name: 'T-bar row', sets: [{ kg: 45, reps: 10 }, { kg: 45, reps: 9 }] }, { name: 'Biceps preacher', sets: [{ kg: 25, reps: 10 }, { kg: 25, reps: 9 }] }] },
      { id: 'demo3', isDemo: true, routineId: 'legs', routineName: 'Leg Day', date: daysAgo(10), finishedAt: 'T18:00', exercises: [{ name: 'Leg press (Squat)', sets: [{ kg: 120, reps: 10 }, { kg: 120, reps: 10 }] }, { name: 'Leg curl', sets: [{ kg: 45, reps: 11 }, { kg: 45, reps: 10 }] }, { name: 'Reverse curl', sets: [{ kg: 15, reps: 12 }, { kg: 15, reps: 11 }] }, { name: 'Zottman curl', sets: [{ kg: 10, reps: 12 }, { kg: 10, reps: 11 }] }] },
      { id: 'demo4', isDemo: true, routineId: 'upper', routineName: 'Upper Day', date: daysAgo(6), finishedAt: 'T18:00', exercises: [{ name: 'Panca inclinata', sets: [{ kg: 65, reps: 8 }, { kg: 65, reps: 8 }] }, { name: 'Row presa stretta', sets: [{ kg: 55, reps: 10 }, { kg: 55, reps: 10 }] }, { name: 'Shoulder press', sets: [{ kg: 47.5, reps: 9 }, { kg: 47.5, reps: 9 }] }, { name: 'Addome cavo', sets: [{ kg: 40, reps: 15 }, { kg: 40, reps: 15 }] }] }
    ];
    state.history = [...state.history, ...demo];
    save(); render(true); toast('Dati di prova caricati');
  }

  function exportBackup() {
    const blob = new Blob([JSON.stringify({ version: 3, exportedAt: new Date().toISOString(), routines: state.routines, history: state.history, exerciseGroups: state.exerciseGroups, goal: state.goal }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `replog-backup-${today()}.json`; a.click();
    URL.revokeObjectURL(a.href); toast('Backup esportato');
  }

  function importBackup(event) {
    const file = event.target.files?.[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!Array.isArray(data.history) || !Array.isArray(data.routines)) throw new Error('invalid');
        if (!confirm('Importare questo backup e sostituire i dati attuali?')) return;
        state = { ...state, routines: data.routines, history: data.history, exerciseGroups: data.exerciseGroups || {}, goal: Number(data.goal) || 4, screen: 'profile', session: null };
        save(); render(false); toast('Backup importato');
      } catch { toast('File backup non valido'); }
      finally { event.target.value = ''; }
    };
    reader.readAsText(file);
  }

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }

  render(false);
})();
</script>
</body>
</html>
`
