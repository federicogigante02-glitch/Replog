```html
<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08080b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RepLog">
  <meta name="description" content="Diario personale di forza e disciplina per registrare allenamenti, carichi e progressioni.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <title>RepLog — Disciplina &amp; Forza</title>
  <style>
    :root{
      color-scheme:dark;
      --bg:#08080b;
      --surface:rgba(20,20,26,.78);
      --surface-solid:#131319;
      --surface-2:rgba(28,28,36,.72);
      --surface-3:rgba(38,38,48,.82);
      --text:#f5f2eb;
      --muted:#8f8b84;
      --line:rgba(255,255,255,.085);
      --line-soft:rgba(255,255,255,.05);
      --crimson:#c81e2d;
      --crimson-soft:#e03545;
      --crimson-deep:#630c16;
      --gold:#dfb764;
      --ice:#67d4ff;
      --red-neg:#ff5a65;
      --radius:22px;
      --radius-sm:15px;
      --shadow:0 18px 48px rgba(0,0,0,.48);
      --font-display:"Cinzel",Georgia,serif;
      --font-sans:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html{background:var(--bg)}
    body{
      margin:0;
      background:
        radial-gradient(ellipse at 75% -12%, rgba(180,24,38,.14), transparent 44%),
        radial-gradient(ellipse at 15% 105%, rgba(223,183,100,.06), transparent 40%),
        var(--bg);
      color:var(--text);
      font-family:var(--font-sans);
      font-size:15px;
      line-height:1.45;
      min-height:100vh;
      -webkit-font-smoothing:antialiased;
    }
    button,input,select,textarea{font:inherit}
    button{color:inherit}

    .app{
      max-width:480px;
      height:100vh;
      height:100dvh;
      min-height:0;
      margin:0 auto;
      position:relative;
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }

    /* KATANA INTRO SPLASH (0.9s) */
    .katana-splash{
      position:fixed;inset:0;z-index:200;pointer-events:none;
      display:grid;place-items:center;
    }
    .slash-half{
      position:absolute;inset:0;
      background:#060608;
      will-change:transform,opacity;
    }
    .slash-half.top{
      clip-path:polygon(0 0, 100% 0, 100% 37%, 0 63%);
      animation:sliceTop .44s cubic-bezier(.7,0,.2,1) .44s forwards;
    }
    .slash-half.bottom{
      clip-path:polygon(0 63%, 100% 37%, 100% 100%, 0 100%);
      animation:sliceBottom .44s cubic-bezier(.7,0,.2,1) .44s forwards;
    }
    .slash-emblem{
      position:relative;z-index:2;
      width:96px;height:96px;
      display:grid;place-items:center;
      animation:emblemPop .82s ease forwards;
    }
    .slash-beam{
      position:absolute;z-index:3;
      left:-15%;right:-15%;top:50%;height:3px;
      background:linear-gradient(90deg, transparent, #c81e2d 25%, #fff5f5 50%, #c81e2d 75%, transparent);
      box-shadow:0 0 24px rgba(220,30,45,.95), 0 0 6px #fff;
      transform:rotate(-15deg) scaleX(0);
      animation:katanaSweep .28s cubic-bezier(.2,.9,.3,1) .24s forwards;
    }
    @keyframes emblemPop{
      0%{opacity:0;transform:scale(.85)}
      30%{opacity:1;transform:scale(1)}
      65%{opacity:1;transform:scale(1)}
      100%{opacity:0;transform:scale(1.06)}
    }
    @keyframes katanaSweep{
      0%{transform:rotate(-15deg) scaleX(0);opacity:1}
      70%{transform:rotate(-15deg) scaleX(1.1);opacity:1}
      100%{transform:rotate(-15deg) scaleX(1.2);opacity:0}
    }
    @keyframes sliceTop{
      to{transform:translate(-12%, -105%);opacity:0}
    }
    @keyframes sliceBottom{
      to{transform:translate(12%, 105%);opacity:0}
    }

    /* TOPBAR + CERAMIC ISLAND */
    .topbar{
      padding:calc(14px + env(safe-area-inset-top)) 20px 10px;
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      z-index:20;flex:0 0 auto;
    }
    .brand{display:flex;align-items:center;gap:10px;min-width:0}
    .brand-mark{
      width:36px;height:36px;border-radius:12px;
      background:linear-gradient(145deg, rgba(200,30,45,.26), rgba(30,22,26,.9));
      border:1px solid rgba(255,255,255,.12);
      display:grid;place-items:center;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.15);
    }
    .brand-name{font-family:var(--font-display);font-size:16px;letter-spacing:.14em;font-weight:800}
    .brand-sub{font-size:10px;color:var(--gold);letter-spacing:.18em;text-transform:uppercase;font-weight:700}

    .avatar-btn{
      border:1px solid rgba(255,255,255,.11);
      background:var(--surface-2);backdrop-filter:blur(16px);
      height:38px;padding:0 11px 0 7px;border-radius:999px;
      display:flex;align-items:center;gap:7px;cursor:pointer;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
    }
    .avatar-crest{width:24px;height:24px;border-radius:50%;background:rgba(200,30,45,.18);display:grid;place-items:center}
    .avatar-initials{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--text)}

    /* CERAMIC ISLAND */
    .ceramic-island-wrap{
      padding:0 18px 8px;flex:0 0 auto;display:flex;justify-content:center;z-index:19;
    }
    .ceramic-island{
      width:100%;max-width:390px;
      border-radius:999px;
      padding:8px 14px;
      background:rgba(12,12,16,.9);
      backdrop-filter:blur(22px);
      border:1px solid rgba(255,255,255,.12);
      box-shadow:0 12px 32px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.1);
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      cursor:pointer;
    }
    .island-left{display:flex;align-items:center;gap:9px;min-width:0}
    .island-dot{width:8px;height:8px;border-radius:50%;background:var(--crimson-soft);box-shadow:0 0 10px var(--crimson);flex:0 0 8px}
    .island-title{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .island-right{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;color:var(--gold);white-space:nowrap;font-variant-numeric:tabular-nums}

    main{
      padding:2px 18px 104px;
      flex:1 1 auto;min-height:0;overflow-y:auto;
      overscroll-behavior:contain;scrollbar-width:none;
    }
    main::-webkit-scrollbar{display:none}

    .eyebrow{font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
    .greeting{padding:8px 4px 14px}
    h1{
      font-family:var(--font-display);font-size:25px;line-height:1.15;
      letter-spacing:.02em;margin:5px 0 5px;font-weight:700;
    }
    h2{font-size:17px;line-height:1.25;margin:0;font-weight:700}
    h3{font-size:15px;line-height:1.25;margin:0;font-weight:700}
    p{margin:0}
    .muted{color:var(--muted)}
    .tiny{font-size:12px;color:var(--muted)}

    /* GLASS CARD BASE */
    .glass{
      background:var(--surface);
      backdrop-filter:blur(20px);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
    }

    /* DAY SWITCHER PILLS */
    .day-switcher{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;padding:2px}
    .day-switcher::-webkit-scrollbar{display:none}
    .day-tab{
      flex:1 0 auto;min-width:68px;border-radius:999px;
      border:1px solid var(--line);background:var(--surface-2);
      padding:8px 13px;font-size:11px;font-weight:700;letter-spacing:.06em;
      color:var(--muted);cursor:pointer;text-align:center;transition:all .18s ease;
    }
    .day-tab.active{
      border-color:rgba(200,30,45,.55);
      background:linear-gradient(135deg, rgba(200,30,45,.26), rgba(99,12,22,.35));
      color:#fff;
      box-shadow:0 4px 16px rgba(200,30,45,.18);
    }

    /* HERO CARD LUXURY */
    .hero{
      position:relative;overflow:hidden;border-radius:26px;padding:22px;
      background:
        radial-gradient(circle at 88% 35%, rgba(200,30,45,.16), transparent 46%),
        linear-gradient(145deg, rgba(28,26,34,.92), rgba(14,14,19,.96));
      border:1px solid rgba(255,255,255,.1);
      box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.1);
      min-height:192px;display:flex;align-items:center;justify-content:space-between;gap:12px;
    }
    .hero-content{position:relative;z-index:2;flex:1;min-width:0}
    .hero-kicker{font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;color:var(--gold)}
    .hero h2{
      font-family:var(--font-display);font-size:24px;margin:7px 0 5px;
      letter-spacing:.03em;color:#fff;
    }
    .hero-meta{color:#b7b2aa;font-size:13px}
    .hero-cta{
      margin-top:18px;min-height:44px;border:0;padding:0 20px;border-radius:14px;
      background:linear-gradient(135deg, #bf1b2a 0%, #7d101b 100%);
      border:1px solid rgba(255,140,150,.22);
      font-weight:750;font-size:13px;letter-spacing:.04em;color:#fff;
      display:inline-flex;align-items:center;gap:8px;cursor:pointer;
      box-shadow:0 10px 26px rgba(180,22,36,.32), inset 0 1px 0 rgba(255,255,255,.18);
      transition:transform .12s ease;
    }
    .hero-cta:active,.primary-button:active,.secondary-button:active{transform:scale(.97)}
    .hero-emblem-box{
      flex:0 0 96px;width:96px;height:112px;
      display:grid;place-items:center;
      border-radius:20px;
      background:radial-gradient(circle, rgba(200,30,45,.12), rgba(0,0,0,.22));
      border:1px solid rgba(255,255,255,.06);
    }
    .hero-emblem-box svg{width:76px;height:86px;filter:drop-shadow(0 6px 18px rgba(200,30,45,.25))}

    /* COLLAPSIBLE WEEKLY DRAWER ON HOME */
    .week-drawer-btn{
      width:100%;margin-top:14px;
      padding:13px 16px;border-radius:18px;
      background:var(--surface);border:1px solid var(--line);
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      cursor:pointer;
    }
    .week-drawer-body{
      margin-top:8px;padding:15px;border-radius:20px;
      background:var(--surface);border:1px solid var(--line);
    }
    .week-days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
    .wday{
      border-radius:14px;padding:8px 2px;text-align:center;
      background:rgba(255,255,255,.03);border:1px solid var(--line-soft);
      font-size:11px;font-weight:700;color:var(--muted);
    }
    .wday span{display:block;font-size:10px;margin-bottom:3px;opacity:.7}
    .wday.trained{
      background:linear-gradient(145deg, rgba(200,30,45,.24), rgba(99,12,22,.3));
      border-color:rgba(200,30,45,.45);color:#fff;
    }
    .wday.today{border-color:rgba(223,183,100,.6);color:var(--gold)}

    .section-head{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 11px;gap:10px}
    .section-head h2{font-family:var(--font-display);font-size:15px;letter-spacing:.08em;text-transform:uppercase}
    .text-button{border:0;background:none;color:var(--gold);padding:4px 2px;font-size:12px;font-weight:700;cursor:pointer}

    .routine-list{display:grid;gap:9px}
    .routine-card{
      border:1px solid var(--line);background:var(--surface);backdrop-filter:blur(16px);
      border-radius:20px;padding:13px 15px;display:flex;align-items:center;gap:13px;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
    }
    .routine-crest{
      width:44px;height:44px;flex:0 0 44px;border-radius:14px;
      background:linear-gradient(145deg, rgba(200,30,45,.16), rgba(20,20,26,.9));
      border:1px solid rgba(255,255,255,.08);display:grid;place-items:center;
    }
    .routine-crest svg{width:26px;height:26px}
    .routine-info{min-width:0;flex:1}
    .routine-info h3{font-size:15px;font-weight:700}
    .routine-info .tiny{margin-top:2px}
    .arrow-button{
      width:38px;height:38px;flex:0 0 38px;border-radius:13px;
      border:1px solid rgba(255,255,255,.1);background:var(--surface-3);
      display:grid;place-items:center;font-size:18px;cursor:pointer;
    }

    /* FLOATING PILL TABBAR (iOS LUXURY) */
    .tabbar-wrap{
      position:fixed;left:0;right:0;bottom:0;z-index:40;
      padding:0 16px calc(12px + env(safe-area-inset-bottom));
      pointer-events:none;
      display:flex;justify-content:center;
    }
    .tabbar{
      pointer-events:auto;
      width:100%;max-width:444px;
      border-radius:26px;
      padding:6px 8px;
      background:rgba(16,16,22,.84);
      backdrop-filter:blur(24px);
      border:1px solid rgba(255,255,255,.11);
      box-shadow:0 16px 40px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.1);
      display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
    }
    .tab{
      border:0;background:transparent;border-radius:20px;min-height:50px;color:#7a7670;
      display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px;
      font-size:10px;font-weight:700;cursor:pointer;transition:all .16s ease;
    }
    .tab svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}
    .tab.active{
      color:#fff;
      background:linear-gradient(145deg, rgba(200,30,45,.24), rgba(110,14,22,.22));
      box-shadow:inset 0 1px 0 rgba(255,255,255,.12);
    }
    .tab.active svg{stroke:var(--crimson-soft)}

    /* BUTTONS & COMMON */
    .page-title{padding:10px 4px 14px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
    .page-title h1{margin:4px 0 0;font-size:24px}
    .pill{
      display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;
      background:var(--surface-2);color:var(--gold);
      font-size:11px;font-weight:750;border:1px solid rgba(223,183,100,.25);white-space:nowrap;
    }
    .button-row{display:flex;gap:8px;align-items:center}
    .primary-button,.secondary-button,.danger-button,.gold-button{
      min-height:44px;padding:0 16px;border-radius:14px;border:0;
      font-weight:750;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;
      transition:transform .12s ease;
    }
    .primary-button{
      background:linear-gradient(135deg, #bf1b2a 0%, #7d101b 100%);
      border:1px solid rgba(255,140,150,.22);color:#fff;
      box-shadow:0 8px 22px rgba(180,22,36,.28), inset 0 1px 0 rgba(255,255,255,.16);
    }
    .secondary-button{background:var(--surface-3);border:1px solid var(--line);color:var(--text)}
    .danger-button{background:rgba(200,30,45,.14);border:1px solid rgba(200,30,45,.34);color:#ff848d}
    .gold-button{background:rgba(223,183,100,.14);border:1px solid rgba(223,183,100,.35);color:var(--gold)}
    .small-btn{min-height:34px;padding:0 12px;font-size:11px;border-radius:11px}
    .full{width:100%}

    .note-card{
      padding:12px 14px;border-radius:16px;background:var(--surface);
      border:1px solid var(--line);color:#ccc6bc;font-size:12px;margin:0 0 13px;
    }

    /* SCHEDE */
    .routine-large{
      background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
      padding:16px;margin-bottom:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
    }
    .routine-large-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
    .routine-large h2{font-family:var(--font-display);font-size:17px;margin-top:3px}
    .exercise-preview{display:flex;flex-wrap:wrap;gap:6px;margin:11px 0 14px}
    .exercise-chip{
      background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;
      padding:5px 9px;color:#d6d0c6;font-size:12px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;
    }
    .chip-del{border:0;background:transparent;color:var(--red-neg);font-size:15px;line-height:1;padding:0 2px;cursor:pointer}

    /* WORKOUT SCREEN */
    .workout-head{padding:8px 0 12px}
    .back-button{
      min-width:40px;height:40px;border-radius:13px;border:1px solid var(--line);
      background:var(--surface-2);font-size:20px;cursor:pointer;display:grid;place-items:center;
    }
    .workout-toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .workout-titlewrap{display:flex;align-items:center;gap:11px;min-width:0}
    .workout-toprow h1{font-size:20px;margin:2px 0 0}
    .workout-actions-bar{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
    .pill-tool{
      border:1px solid var(--line);background:var(--surface-2);border-radius:999px;
      padding:7px 12px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px;cursor:pointer;
      font-variant-numeric:tabular-nums;
    }
    .pill-tool.running{background:linear-gradient(135deg,#bf1b2a,#7d101b);border-color:rgba(255,140,150,.3);color:#fff}
    .pill-tool.muscle-btn{border-color:rgba(223,183,100,.32);color:var(--gold)}

    .rest-bar{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
    .rest-chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 11px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer}

    .exercise-card{
      background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
      padding:14px;margin:0 0 12px;transition:border-color .18s ease;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
    }
    .exercise-card.is-saved{
      border-color:rgba(223,183,100,.45);
      background:linear-gradient(160deg, rgba(223,183,100,.06), var(--surface) 45%);
    }
    .exercise-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .exercise-title{display:flex;align-items:center;gap:9px;min-width:0}
    .exercise-number{
      width:28px;height:28px;border-radius:9px;background:rgba(200,30,45,.15);
      border:1px solid rgba(200,30,45,.3);color:#ff848d;font-size:11px;font-weight:800;
      display:grid;place-items:center;flex:0 0 28px;
    }
    .exercise-card.is-saved .exercise-number{
      background:rgba(223,183,100,.18);border-color:rgba(223,183,100,.45);color:var(--gold);
    }
    .exercise-actions{display:flex;align-items:center;gap:6px}
    .save-ex-btn{
      border:1px solid rgba(255,255,255,.14);background:var(--surface-3);border-radius:10px;
      color:#fff;padding:6px 11px;font-size:11px;font-weight:750;cursor:pointer;white-space:nowrap;
    }
    .save-ex-btn.done{
      border-color:rgba(223,183,100,.5);background:rgba(223,183,100,.16);color:var(--gold);
    }
    .remove-exercise{border:0;background:transparent;color:var(--muted);font-size:18px;width:28px;height:30px;cursor:pointer}

    .previous{
      margin:9px 0 10px;padding:8px 11px;border-radius:12px;
      background:rgba(0,0,0,.28);border:1px solid var(--line-soft);font-size:12px;color:#b2aca3;
    }
    .previous strong{color:var(--text)}
    .previous-title{font-size:9px;text-transform:uppercase;letter-spacing:.14em;color:var(--gold);margin-bottom:2px;font-weight:800}

    .set-head,.set-row{display:grid;grid-template-columns:30px minmax(70px,1fr) minmax(70px,1fr) 34px 26px;gap:6px;align-items:center}
    .set-head{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 2px 6px;font-weight:750}
    .set-row{padding:5px 0;border-top:1px solid var(--line-soft)}
    .set-label{font-family:var(--font-display);font-size:12px;color:var(--gold);font-weight:700;padding-left:4px}
    .input-wrap{position:relative}
    .input-wrap input{
      width:100%;height:42px;border-radius:12px;border:1px solid rgba(255,255,255,.1);
      background:rgba(8,8,11,.85);color:var(--text);outline:none;padding:0 26px 0 10px;
      font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;
      appearance:textfield;-moz-appearance:textfield;
    }
    .input-wrap input::-webkit-outer-spin-button,.input-wrap input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
    .input-wrap input:focus{border-color:rgba(223,183,100,.6);box-shadow:0 0 0 3px rgba(223,183,100,.12)}
    /* COLORI WORKOUT RICHIESTI: ORO kg · BLU CHIARO +reps · ROSSO -reps */
    .weight-input input{color:var(--gold)}
    .reps-input input{color:#f5f2eb}

<body>

<script>
(() => {
  const STORAGE_KEY = 'replog-data-v1';

  const SPLIT_PRESETS = {

        { id: 'pull', name: 'Pull Day', tag: 'TIRATA', theme: 'samurai', exercises: ['Biceps curl', 'Biceps preacher', 'Lat machine', 'Lat machine presa stretta', 'T-bar row', 'Biceps supino', 'Addome cavo'] },
        { id: 'legs', name: 'Leg Day', tag: 'GAMBE & AVAMBRACCI', theme: 'samurai', exercises: ['Leg press (Squat)', 'Leg extension', 'Leg curl', 'Polpacci in piedi', 'Reverse curl', 'Zottman curl'] },
        { id: 'upper', name: 'Upper Day', tag: 'UPPER COMPLETO', theme: 'spartan-outline', exercises: ['Pec deck', 'Panca inclinata', 'Lat machine', 'Row presa stretta', 'T-bar row', 'Shoulder press', 'Alzate laterali macchina', 'Triceps push down', 'Biceps preacher', 'Biceps supino', 'Addome cavo'] },

      routines: [
        { id: 'push', name: 'Push Day', tag: 'SPINTA', theme: 'spartan', exercises: ['Pec deck', 'Panca inclinata', 'Alzate laterali macchina', 'Shoulder press', 'Triceps push down', 'Triceps overhead extension'] },
        { id: 'pull', name: 'Pull Day', tag: 'TIRATA', theme: 'samurai', exercises: ['Lat machine', 'Lat machine presa stretta', 'T-bar row', 'Biceps curl', 'Biceps preacher', 'Addome cavo'] },
        { id: 'legs', name: 'Leg Day', tag: 'GAMBE', theme: 'samurai', exercises: ['Leg press (Squat)', 'Leg extension', 'Leg curl', 'Polpacci in piedi', 'Reverse curl', 'Zottman curl'] }

      routines: [
        { id: 'upper', name: 'Upper Day', tag: 'PARTE ALTA', theme: 'spartan', exercises: ['Panca inclinata', 'Pec deck', 'Lat machine', 'Row presa stretta', 'Shoulder press', 'Alzate laterali macchina', 'Triceps push down', 'Biceps preacher'] },
        { id: 'lower', name: 'Lower Day', tag: 'PARTE BASSA', theme: 'samurai', exercises: ['Leg press (Squat)', 'Leg extension', 'Leg curl', 'Polpacci in piedi', 'Reverse curl', 'Addome cavo'] }
      ]
    },
    torso_limbs: {
      name: 'Torso / Limbs (4 Giorni)',
      desc: 'Petto-Schiena-Spalle vs Braccia-Gambe',
      routines: [
        { id: 'torso', name: 'Torso Day', tag: 'PETTO · SCHIENA · SPALLE', theme: 'spartan', exercises: ['Panca inclinata', 'Pec deck', 'Lat machine', 'T-bar row', 'Shoulder press', 'Alzate laterali macchina', 'Addome cavo'] },
        { id: 'limbs', name: 'Limbs Day', tag: 'BRACCIA · GAMBE', theme: 'samurai', exercises: ['Leg press (Squat)', 'Leg extension', 'Leg curl', 'Polpacci in piedi', 'Biceps preacher', 'Triceps push down', 'Reverse curl', 'Zottman curl'] }
      ]
    },
    fullbody: {
      name: 'Full Body (3 Giorni)',
      desc: 'Tutto il corpo in ogni seduta',
      routines: [
        { id: 'full-a', name: 'Full Body A', tag: 'COMPLETA', theme: 'spartan-outline', exercises: ['Leg press (Squat)', 'Panca inclinata', 'Lat machine', 'Shoulder press', 'Biceps curl', 'Triceps push down', 'Addome cavo'] }
      ]
    }
  };

  const MUSCLE_GROUPS = [
    { id: 'all', label: 'Generale' },
    { id: 'petto', label: 'Petto' },
    { id: 'schiena', label: 'Schiena' },
    { id: 'spalle', label: 'Spalle' },
    { id: 'tricipiti', label: 'Tricipiti' },
    { id: 'bicipiti', label: 'Bicipiti' },
    { id: 'avambracci', label: 'Avambracci' },
    { id: 'gambe', label: 'Gambe' },
    { id: 'addome', label: 'Addome' }
  ];

  const CRESTS = [
    { id: 'spartan', label: 'Spartano' },
    { id: 'samurai', label: 'Samurai' },
    { id: 'dragon', label: 'Drago' },
    { id: 'wolf', label: 'Lupo' },
    { id: 'bear', label: 'Orso' }
  ];

  const initial = {
    goal: 4,
    profile: { name: 'Federico', initials: 'FG', crest: 'spartan' },
    activeSplit: 'ppl_upper',
    katanaIntro: true,
    routines: SPLIT_PRESETS.ppl_upper.routines,
    history: [],
    exerciseGroups: {},
    screen: 'home',
    session: null
  };

  const ui = {
    homeRoutineId: null,
    homeWeekOpen: false,
    muscle: 'all',
    exerciseFilter: 'all',
    metric: 'volume',
    chartPoint: null,
    editingRoutine: null,
    addingRoutine: false,
    restOpen: false,
    muscleModalOpen: false,
    muscleModalSide: 'front',
    selectedExercise: null,
    exSearch: '',
    importTab: 'note',
    manualRoutineId: 'push',
    manualDate: '',
    manualSets: {},
    noteText: '',
    parsedNoteSessions: null,
    showSplash: false
  };

  const fresh = () => JSON.parse(JSON.stringify(initial));
  let state;
  try { state = { ...fresh(), ...JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}') }; }
  catch { state = fresh(); }
  if (!state.profile) state.profile = fresh().profile;
  if (!Array.isArray(state.routines) || !state.routines.length) state.routines = fresh().routines;
  if (!Array.isArray(state.history)) state.history = [];
  if (!state.exerciseGroups) state.exerciseGroups = {};
  if (typeof state.katanaIntro !== 'boolean') state.katanaIntro = true;

  // Mostra animazione katana 0.9s all'apertura
  if (state.katanaIntro) ui.showSplash = true;

  const app = document.getElementById('app');
  const toastEl = document.getElementById('toast');
  let toastTimer, restTimerInterval = null, restSecondsLeft = 0;

  const esc = (s = '') => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => Math.random().toString(36).slice(2, 9);
  const save = () => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {} };

  const today = () => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  };
  ui.manualDate = today();

  const fmtDate = d => new Intl.DateTimeFormat('it-IT', { day: 'numeric', month: 'short' }).format(new Date((d || today()) + 'T12:00:00'));
  const fmtFullDate = d => new Intl.DateTimeFormat('it-IT', { weekday: 'long', day: 'numeric', month: 'long' }).format(new Date((d || today()) + 'T12:00:00'));
  const fmtNum = n => String(n ?? '').replace('.', ',');
  const fmtLoad = kg => kg == null || kg === '' ? 'corpo libero' : `${fmtNum(kg)} kg`;
  const toRoman = n => ['I', 'II', 'III', 'IV', 'V', 'VI'][n] || String(n + 1);

  function classifyExercise(name = '') {
    const key = name.trim().toLowerCase();
    if (state.exerciseGroups[key]) return state.exerciseGroups[key];
    if (/reverse curl|zottman|avambracc|wrist|forearm/.test(key)) return 'avambracci';
    if (/pec|peck|panca|chest|croci|fly|piegament/.test(key)) return 'petto';
    if (/alzate|shoulder|military|lento|deltoid|arnold/.test(key)) return 'spalle';
    if (/tricep|push.?down|overhead|french|skull/.test(key)) return 'tricipiti';
    if (/leg|squat|pressa|press|polpacc|calf|calves|affond|lunge|femoral|quad|stacco/.test(key)) return 'gambe';
    if (/lat|row|remator|pulley|trazion|pull.?up|chin.?up|dorso/.test(key)) return 'schiena';
    if (/bicep|curl|preacher|hammer|martello|scott/.test(key)) return 'bicipiti';
    if (/addom|abs|crunch|plank/.test(key)) return 'addome';
    return 'altro';
  }

  const repsChange = (current, previous) => {
    if (current === '' || previous == null || previous === '') return { cls: 'none', label: '' };
    const diff = Number(current) - Number(previous);
    if (diff > 0) return { cls: 'up', label: '+' + diff };
    if (diff < 0) return { cls: 'down', label: String(diff) };
    return { cls: 'same', label: '=' };
  };

  const recentSessions = () => [...state.history].sort((a, b) => (b.date + (b.finishedAt || '')).localeCompare(a.date + (a.finishedAt || '')));
  const chronoSessions = () => [...state.history].sort((a, b) => (a.date + (a.finishedAt || '')).localeCompare(b.date + (b.finishedAt || '')));
  const lastForRoutine = id => recentSessions().find(s => s.routineId === id);

  const lastForExercise = (name, skipId = null) => {
    for (const s of recentSessions()) {
      if (skipId && s.id === skipId) continue;
      const ex = s.exercises.find(e => e.name.toLowerCase() === name.toLowerCase());
      if (ex && ex.sets?.length) return { ...ex, date: s.date };
    }
    return null;
  };

  const countThisWeek = () => {
    const now = new Date(), monday = new Date(now);
    monday.setHours(0, 0, 0, 0);
    monday.setDate(now.getDate() - ((now.getDay() + 6) % 7));
    return state.history.filter(s => new Date(s.date + 'T12:00:00') >= monday).length;
  };

  const totalVolume = () => state.history.reduce((sum, s) =>
    sum + s.exercises.reduce((sub, e) => sub + e.sets.reduce((v, set) => v + (Number(set.kg) || 0) * (Number(set.reps) || 0), 0), 0), 0);

  function toast(message) {
    toastEl.textContent = message;
    toastEl.classList.add('show');

    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400);

  // EMBLEMI VETTORIALI ISPIRATI ALLE FOTO 1, 2, 4, 5
  function emblemSvg(type = 'spartan') {
    if (type === 'spartan-outline') {
      return `<svg viewBox="0 0 80 96" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M40 6L46 16C57 18 65 25 66 34L62 42L65 55L52 78L45 88V48L57 42L55 34L40 38L25 34L23 42L35 48V88L28 78L15 55L18 42L14 34C15 25 23 18 34 16L40 6Z" stroke="#d42333" stroke-width="2.6" stroke-linejoin="round"/>
        <path d="M23 36L36 42V55M57 36L44 42V55" stroke="#f5f2eb" stroke-width="2" stroke-linecap="round"/>
      </svg>`;
    }

  // MINI CALENDARIO SETTIMANALE + SPARKLINE (A SCOMPARSA NELLA HOME)
  function weeklyMiniPanel() {
    const now = new Date();
    const monday = new Date(now);
    monday.setHours(0, 0, 0, 0);
    monday.setDate(now.getDate() - ((now.getDay() + 6) % 7));
    const labels = ['L', 'M', 'M', 'G', 'V', 'S', 'D'];
    const todayStr = today();
    const days = labels.map((lbl, i) => {
      const d = new Date(monday); d.setDate(monday.getDate() + i);
      const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      const trained = state.history.some(s => s.date === iso);
      return { lbl, num: d.getDate(), trained, isToday: iso === todayStr };
    });

    const last8 = chronoSessions().slice(-8).map(s =>
      s.exercises.reduce((sum, e) => sum + e.sets.reduce((v, st) => v + (Number(st.kg) || 0) * (Number(st.reps) || 0), 0), 0)
    );
    let sparkSvg = '<p class="tiny" style="text-align:center;padding:6px 0">Registra 2+ sedute per vedere la sparkline del volume.</p>';
    if (last8.length >= 2) {
      const W = 280, H = 48, min = Math.min(...last8), max = Math.max(...last8) || 1;
      const pts = last8.map((v, i) => {
        const x = (i / (last8.length - 1)) * (W - 12) + 6;
        const y = H - 8 - ((v - min) / (max - min || 1)) * (H - 16);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' ');
      sparkSvg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:48px;display:block">
        <polyline points="${pts}" fill="none" stroke="#dfb764" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`;
    }

    return `<div class="week-drawer-body">
      <div class="eyebrow" style="margin-bottom:8px">Giorni di questa settimana</div>
      <div class="week-days">
        ${days.map(d => `<div class="wday ${d.trained ? 'trained' : ''} ${d.isToday ? 'today' : ''}"><span>${d.lbl}</span>${d.trained ? '✓' : d.num}</div>`).join('')}
      </div>
      <div class="eyebrow" style="margin-bottom:4px">Andamento volume recente</div>
      ${sparkSvg}
    </div>`;
  }

  // MAPPA ANATOMICA MODAL (GRECO FRONTALE / SAMURAI RETRO)
  function getLitMusclesInSession() {
    const lit = new Set();
    const target = new Set();
    if (!state.session) return { lit, target };
    state.session.exercises.forEach(ex => {
      const grp = classifyExercise(ex.name);
      target.add(grp);
      if (ex.saved || ex.sets.some(s => String(s.reps).trim() !== '')) lit.add(grp);
    });
    return { lit, target };
  }

  function getAllKnownExercises() {
    const map = new Map();
    state.routines.forEach(r => r.exercises.forEach(n => map.set(n.toLowerCase(), n)));
    state.history.forEach(s => s.exercises.forEach(ex => map.set(ex.name.toLowerCase(), ex.name)));
    return [...map.values()].sort((a, b) => a.localeCompare(b, 'it'));
  }

  // IMPORTAZIONE NOTE & MANUALE
  function parseNoteText(raw) {
    const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    const months = { gen: 1, gennaio: 1, feb: 2, febbraio: 2, mar: 3, marzo: 3, apr: 4, aprile: 4, mag: 5, maggio: 5, giu: 6, giugno: 6, lug: 7, luglio: 7, ago: 8, agosto: 8, set: 9, sett: 9, settembre: 9, ott: 10, ottobre: 10, nov: 11, novembre: 11, dic: 12, dicembre: 12 };
    const sessions = []; let current = null;
    const guessRoutine = t => {
      t = t.toLowerCase();
      if (/upper/.test(t)) return { id: 'upper', name: 'Upper Day' };
      if (/lower/.test(t)) return { id: 'lower', name: 'Lower Day' };
      if (/leg|gambe/.test(t)) return { id: 'legs', name: 'Leg Day' };
      if (/pull|tirata|schiena/.test(t)) return { id: 'pull', name: 'Pull Day' };
      if (/push|spinta|petto/.test(t)) return { id: 'push', name: 'Push Day' };
      return null;
    };
    const parseDate = line => {
      let m = line.match(/\b(\d{4})-(\d{1,2})-(\d{1,2})\b/);
      if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
      m = line.match(/\b(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{2,4}))?\b/);
      if (m) return `${m[3] ? (m[3].length === 2 ? '20' + m[3] : m[3]) : new Date().getFullYear()}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
      m = line.match(/\b(\d{1,2})\s+(gen(?:naio)?|feb(?:braio)?|mar(?:zo)?|apr(?:ile)?|mag(?:gio)?|giu(?:gno)?|lug(?:lio)?|ago(?:sto)?|sett?(?:embre)?|ott(?:obre)?|nov(?:embre)?|dic(?:embre)?)(?:\s+(\d{4}))?\b/i);
      if (m) return `${m[3] || new Date().getFullYear()}-${String(months[m[2].toLowerCase()] || 1).padStart(2, '0')}-${m[1].padStart(2, '0')}`;
      return null;
    };
    const parseSets = str => {
      const sets = [], pairRe = /(\d+(?:[.,]\d+)?)\s*(?:kg)?\s*[x×*]\s*(\d+)/gi;
      let match;
      while ((match = pairRe.exec(str)) !== null) sets.push({ kg: Number(match[1].replace(',', '.')), reps: Number(match[2]) });
      if (sets.length) {
        const tail = str.slice(pairRe.lastIndex).match(/\b\d+\b/g);
        if (tail && sets.length === 1) tail.forEach(r => sets.push({ kg: sets[0].kg, reps: Number(r) }));
        return sets;
      }
      const kgLead = str.match(/^(\d+(?:[.,]\d+)?)\s*kg\b(.*)$/i);
      if (kgLead) {
        const kg = Number(kgLead[1].replace(',', '.'));
        (kgLead[2].match(/\d+/g) || []).forEach(r => sets.push({ kg, reps: Number(r) }));
        if (sets.length) return sets;
      }
      const plain = str.match(/\b\d+\b/g);
      if (plain && plain.length <= 6) plain.forEach(r => sets.push({ kg: null, reps: Number(r) }));
      return sets;
    };
    for (const line of lines) {
      const d = parseDate(line), r = guessRoutine(line);
      if (d || (r && !/\d+\s*[x×*]\s*\d+|\d+\s*kg|\:\s*\d+/i.test(line))) {
        const rt = r || { id: 'custom', name: 'Allenamento' };
        current = { id: 'imp-' + uid(), routineId: rt.id, routineName: rt.name, date: d || today(), finishedAt: new Date().toISOString(), exercises: [] };
        sessions.push(current); continue;
      }
      let name = '', rest = '';
      const ci = line.indexOf(':');
      if (ci > 1) { name = line.slice(0, ci).trim(); rest = line.slice(ci + 1).trim(); }
      else {
        const ns = line.search(/\s\d+(?:[.,]\d+)?(?:\s*(?:kg|[x×*])|\s+\d|$)/i);
        if (ns > 1) { name = line.slice(0, ns).replace(/[-–:]+$/, '').trim(); rest = line.slice(ns).trim(); }
      }
      if (name && rest) {
        const sets = parseSets(rest);
        if (sets.length) {
          if (!current) { current = { id: 'imp-' + uid(), routineId: 'custom', routineName: 'Allenamento', date: today(), finishedAt: new Date().toISOString(), exercises: [] }; sessions.push(current); }
          current.exercises.push({ name, sets });
        }
      }
    }
    return sessions.filter(s => s.exercises.length > 0);
  }

  // GRAFICI
  function buildSeriesData(muscleFilter, exerciseFilter, metric) {
    const points = [];
    for (const s of chronoSessions()) {
      const matchingEx = s.exercises.filter(ex => {
        if (muscleFilter !== 'all' && classifyExercise(ex.name) !== muscleFilter) return false;
        if (exerciseFilter !== 'all' && ex.name.toLowerCase() !== exerciseFilter.toLowerCase()) return false;
        return true;
      });
      if (!matchingEx.length) continue;
      let value = 0, totalReps = 0, totalVol = 0, maxKg = 0, max1RM = 0, bestSetText = '', setsCount = 0;
      for (const ex of matchingEx) {
        for (const set of ex.sets) {
          const kg = Number(set.kg) || 0, reps = Number(set.reps) || 0;
          setsCount++; totalReps += reps; totalVol += kg * reps;
          if (kg > maxKg) maxKg = kg;
          const e1rm = kg > 0 ? kg * (1 + reps / 30) : reps;
          if (e1rm >= max1RM) { max1RM = e1rm; bestSetText = `${ex.name}: ${fmtLoad(set.kg)} × ${reps}`; }
        }
      }
      if (metric === 'volume') value = Math.round(totalVol);
      else if (metric === 'maxKg') value = Number(maxKg.toFixed(1));
      else if (metric === 'e1rm') value = Math.round(max1RM);
      else value = totalReps;
      points.push({ date: s.date, routineName: s.routineName, value, totalReps, setsCount, bestSetText });
    }
    return points;
  }

  function renderChartSvg(points) {
    if (!points.length) return '';
    const W = 340, H = 160, padL = 34, padR = 12, padT = 16, padB = 26;
    const innerW = W - padL - padR, innerH = H - padT - padB;
    const vals = points.map(p => p.value);
    let minV = Math.min(...vals), maxV = Math.max(...vals);
    if (minV === maxV) { minV = Math.max(0, minV * 0.8); maxV = maxV === 0 ? 10 : maxV * 1.2; }
    else { const span = maxV - minV; minV = Math.max(0, minV - span * 0.12); maxV += span * 0.12; }

    const coords = points.map((p, i) => ({
      x: points.length === 1 ? padL + innerW / 2 : padL + (i / (points.length - 1)) * innerW,
      y: padT + innerH - ((p.value - minV) / (maxV - minV)) * innerH, p, i
    }));
    const linePts = coords.map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(' ');
    const areaPath = coords.length > 1
      ? `M ${coords[0].x.toFixed(1)},${(padT + innerH).toFixed(1)} L ${coords.map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(' L ')} L ${coords[coords.length - 1].x.toFixed(1)},${(padT + innerH).toFixed(1)} Z` : '';
    const sel = (ui.chartPoint != null && ui.chartPoint < points.length) ? ui.chartPoint : points.length - 1;

    return `<svg class="chart-svg" viewBox="0 0 ${W} ${H}">
      <defs><linearGradient id="cArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c81e2d" stop-opacity="0.34"/><stop offset="100%" stop-color="#c81e2d" stop-opacity="0"/></linearGradient></defs>
      ${[0, 0.5, 1].map(t => {
        const y = padT + innerH * (1 - t);
        return `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="rgba(255,255,255,0.06)" stroke-dasharray="3 3"/><text x="${padL - 6}" y="${y + 3}" text-anchor="end" fill="#7c7770" font-size="9">${Math.round(minV + (maxV - minV) * t)}</text>`;
      }).join('')}
      ${areaPath ? `<path d="${areaPath}" fill="url(#cArea)"/>` : ''}
      ${coords.length > 1 ? `<polyline points="${linePts}" fill="none" stroke="#e03545" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>` : ''}
      ${coords.map(c => {
        const isSel = c.i === sel;
        return `<g data-chart-pt="${c.i}" style="cursor:pointer">
          <circle cx="${c.x}" cy="${c.y}" r="14" fill="transparent"/>
          <circle cx="${c.x}" cy="${c.y}" r="${isSel ? 5.5 : 3.8}" fill="${isSel ? '#dfb764' : '#0b0b0e'}" stroke="#e03545" stroke-width="2.2"/>
        </g>`;
      }).join('')}
      ${coords.map((c, idx) => (points.length <= 6 || idx === 0 || idx === points.length - 1 || idx === Math.floor(points.length / 2))
        ? `<text x="${c.x}" y="${H - 6}" text-anchor="middle" fill="#8a857e" font-size="9">${esc(fmtDate(c.p.date))}</text>` : '').join('')}
    </svg>`;
  }

  function progressView() {
    const sessions = recentSessions();
    const hasDemo = state.history.some(s => s.isDemo);
    const exSet = new Set();
    state.history.forEach(s => s.exercises.forEach(ex => { if (ui.muscle === 'all' || classifyExercise(ex.name) === ui.muscle) exSet.add(ex.name); }));
    const availableEx = [...exSet].sort();
    if (ui.exerciseFilter !== 'all' && !availableEx.some(e => e.toLowerCase() === ui.exerciseFilter.toLowerCase())) ui.exerciseFilter = 'all';

    const points = buildSeriesData(ui.muscle, ui.exerciseFilter, ui.metric);

    const latest = points[points.length - 1], first = points[0];
    let deltaPct = (points.length >= 2 && first.value > 0) ? Math.round(((latest.value - first.value) / first.value) * 100) : null;
    const selPoint = points[(ui.chartPoint != null && ui.chartPoint < points.length) ? ui.chartPoint : points.length - 1];

    const groupTotals = {};
    MUSCLE_GROUPS.filter(g => g.id !== 'all').forEach(g => groupTotals[g.id] = { label: g.label, vol: 0, sets: 0 });
    state.history.forEach(s => s.exercises.forEach(ex => {
      const g = classifyExercise(ex.name);
      if (groupTotals[g]) ex.sets.forEach(set => { groupTotals[g].sets++; groupTotals[g].vol += (Number(set.kg) || 0) * (Number(set.reps) || 0); });
    }));
    const groupList = Object.values(groupTotals).filter(g => g.sets > 0).sort((a, b) => b.vol - a.vol);
    const maxGroupVol = groupList[0]?.vol || 1;

    const bests = {};
    state.history.forEach(s => s.exercises.forEach(ex => {
      if (ui.muscle !== 'all' && classifyExercise(ex.name) !== ui.muscle) return;
      ex.sets.forEach(set => {
        const kg = Number(set.kg) || 0, reps = Number(set.reps) || 0;

        if (!bests[ex.name] || kg > bests[ex.name].kg || (kg === bests[ex.name].kg && reps > bests[ex.name].reps)) bests[ex.name] = { kg, reps, date: s.date, e1rm: Math.round(score) };
      });
    }));
    const bestEntries = Object.entries(bests).sort((a, b) => b[1].kg - a[1].kg).slice(0, 10);

    return `${header()}<main>
      <section class="page-title">
        <div><div class="eyebrow">Analisi</div><h1>Grafici</h1></div>
        <button class="secondary-button small-btn" data-action="open-import">＋ Carica note</button>
      </section>

      ${state.history.length === 0 ? `<div class="empty-state" style="margin-bottom:14px">
        <h3>Nessun dato registrato</h3>
        <p class="tiny" style="margin:6px 0 14px">Importa i tuoi 2 mesi di note oppure prova i grafici con dati simulati.</p>
        <div class="button-row" style="justify-content:center;flex-wrap:wrap">
          <button class="primary-button" data-action="open-import">Importa Note</button>
          <button class="secondary-button" data-action="load-demo">Dati di prova</button>
        </div></div>` : ''}

      ${hasDemo ? `<div class="note-card" style="display:flex;justify-content:space-between;align-items:center"><span>Dati di prova attivi.</span><button class="danger-button small-btn" data-action="clear-demo">Rimuovi demo</button></div>` : ''}

      <div class="filter-scroll">${MUSCLE_GROUPS.map(g => `<button class="filter-chip ${ui.muscle === g.id ? 'active' : ''}" data-muscle="${g.id}">${esc(g.label)}</button>`).join('')}</div>

      ${availableEx.length > 1 ? `<select class="form-select" id="exercise-filter" style="margin-bottom:10px"><option value="all">Tutti gli esercizi</option>${availableEx.map(n => `<option value="${esc(n)}" ${ui.exerciseFilter === n ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>` : ''}

      <div class="metric-tabs">
        <button class="metric-btn ${ui.metric === 'volume' ? 'active' : ''}" data-metric="volume">Volume</button>
        <button class="metric-btn ${ui.metric === 'maxKg' ? 'active' : ''}" data-metric="maxKg">Max Kg</button>
        <button class="metric-btn ${ui.metric === 'e1rm' ? 'active' : ''}" data-metric="e1rm">1RM Stima</button>
        <button class="metric-btn ${ui.metric === 'reps' ? 'active' : ''}" data-metric="reps">Reps</button>
      </div>

      <section class="chart-box">
        <div class="chart-header">
          <div><div class="eyebrow">${esc(metricInfo.label)}</div><div class="chart-big">${latest ? `${latest.value.toLocaleString('it-IT')} <small>${metricInfo.unit}</small>` : '—'}</div></div>
          ${deltaPct !== null ? `<span class="trend-badge ${deltaPct > 0 ? 'up' : deltaPct < 0 ? 'down' : 'flat'}">${deltaPct > 0 ? '+' : ''}${deltaPct}%</span>` : ''}
        </div>

  // GENERATORE ICONE PNG SU CANVAS PER IPHONE
  function downloadAppIcon(size) {
    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    const s = size / 100;
    // Sfondo nero ossidiana + bagliore cremisi tenue
    ctx.fillStyle = '#08080b';
    ctx.fillRect(0, 0, size, size);
    const grad = ctx.createRadialGradient(50 * s, 45 * s, 4 * s, 50 * s, 50 * s, 46 * s);
    grad.addColorStop(0, 'rgba(200,30,45,0.28)');
    grad.addColorStop(1, 'rgba(8,8,11,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, size, size);
    // Cresta Samurai cremisi
    ctx.fillStyle = '#d42333';
    ctx.beginPath();
    ctx.moveTo(22 * s, 20 * s);
    ctx.quadraticCurveTo(50 * s, 38 * s, 78 * s, 20 * s);
    ctx.quadraticCurveTo(72 * s, 42 * s, 50 * s, 44 * s);
    ctx.quadraticCurveTo(28 * s, 42 * s, 22 * s, 20 * s);
    ctx.fill();
    // Elmo scuro con bordo avorio
    ctx.fillStyle = '#1b1b22';
    ctx.strokeStyle = '#f5f2eb';
    ctx.lineWidth = 2.2 * s;
    ctx.beginPath();
    ctx.moveTo(30 * s, 46 * s); ctx.lineTo(70 * s, 46 * s); ctx.lineTo(77 * s, 58 * s);
    ctx.lineTo(68 * s, 62 * s); ctx.lineTo(72 * s, 72 * s); ctx.lineTo(50 * s, 83 * s);
    ctx.lineTo(28 * s, 72 * s); ctx.lineTo(32 * s, 62 * s); ctx.lineTo(23 * s, 58 * s);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // Occhi affilati
    ctx.fillStyle = '#f5f2eb';
    ctx.beginPath();
    ctx.moveTo(34 * s, 54 * s); ctx.lineTo(46 * s, 58 * s); ctx.lineTo(35 * s, 60 * s); ctx.closePath();
    ctx.moveTo(66 * s, 54 * s); ctx.lineTo(54 * s, 58 * s); ctx.lineTo(65 * s, 60 * s); ctx.closePath();
    ctx.fill();

    const a = document.createElement('a');
    a.download = `icon-${size}.png`;
    a.href = canvas.toDataURL('image/png');
    a.click();
    toast(`icon-${size}.png scaricata`);
  }

  function render(keepScroll = false) {
    const prevScroll = keepScroll ? (app.querySelector('main')?.scrollTop || 0) : 0;
    const views = { home: homeView, routines: routinesView, workout: workoutView, progress: progressView, profile: profileView, exercises: exercisesView, 'exercise-detail': exerciseDetailView, import: importView };
    app.innerHTML = renderSplash() + (views[state.screen] || homeView)();
    bind();
    const m = app.querySelector('main');
    if (m) m.scrollTop = keepScroll ? prevScroll : 0;
    if (ui.showSplash) {
      setTimeout(() => { ui.showSplash = false; document.getElementById('katana-splash')?.remove(); }, 920);
    }
  }

  function bind() {
    app.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => { state.screen = b.dataset.nav; save(); render(false); }));
    app.querySelectorAll('[data-pick-home]').forEach(b => b.addEventListener('click', () => { ui.homeRoutineId = b.dataset.pickHome; render(true); }));
    app.querySelectorAll('[data-start]').forEach(b => b.addEventListener('click', () => startSession(b.dataset.start)));
    app.querySelectorAll('[data-action]').forEach(b => b.addEventListener('click', () => action(b.dataset.action)));

    app.querySelectorAll('[data-open-ex]').forEach(el => el.addEventListener('click', () => {
      ui.prevScreenForEx = state.screen; ui.selectedExercise = el.dataset.openEx; state.screen = 'exercise-detail'; render(false);
    }));

    // Muscle modal
    app.querySelectorAll('[data-side]').forEach(b => b.addEventListener('click', () => { ui.muscleModalSide = b.dataset.side; render(true); }));

    // Profile customization
    app.querySelector('#prof-name')?.addEventListener('input', e => {
      state.profile.name = e.target.value;
      const parts = e.target.value.trim().split(/\s+/).filter(Boolean);
      if (parts.length >= 2) state.profile.initials = (parts[0][0] + parts[1][0]).toUpperCase();
      else if (parts.length === 1) state.profile.initials = parts[0].slice(0, 2).toUpperCase();
      save();
    });
    app.querySelector('#prof-init')?.addEventListener('input', e => { state.profile.initials = e.target.value.toUpperCase().slice(0, 3); save(); });
    app.querySelectorAll('[data-pick-crest]').forEach(b => b.addEventListener('click', () => { state.profile.crest = b.dataset.pickCrest; save(); render(true); }));
    app.querySelectorAll('[data-pick-split]').forEach(b => b.addEventListener('click', () => {
      const key = b.dataset.pickSplit, preset = SPLIT_PRESETS[key];
      if (!preset) return;
      if (!confirm(`Attivare la split "${preset.name}"? I tuoi vecchi allenamenti e grafici NON verranno toccati.`)) return;
      state.activeSplit = key;
      state.routines = JSON.parse(JSON.stringify(preset.routines));
      ui.homeRoutineId = null;
      save(); render(true); toast('Split aggiornata');
    }));
    app.querySelectorAll('[data-dl-icon]').forEach(b => b.addEventListener('click', () => downloadAppIcon(Number(b.dataset.dlIcon))));

    // Routines editor
    app.querySelectorAll('[data-toggle-edit]').forEach(b => b.addEventListener('click', () => { ui.editingRoutine = ui.editingRoutine === b.dataset.toggleEdit ? null : b.dataset.toggleEdit; render(true); }));
    app.querySelectorAll('[data-del-routine-ex]').forEach(b => b.addEventListener('click', () => {
      const [id, idx] = b.dataset.delRoutineEx.split(':'), r = state.routines.find(x => x.id === id);
      if (!r || r.exercises.length <= 1) { toast('Lascia almeno un esercizio'); return; }
      r.exercises.splice(Number(idx), 1); save(); render(true);
    }));
    app.querySelectorAll('[data-add-routine-ex]').forEach(b => b.addEventListener('click', () => {
      const id = b.dataset.addRoutineEx, val = app.querySelector(`#add-routine-input-${id}`)?.value.trim();
      if (!val) return;
      state.routines.find(x => x.id === id)?.exercises.push(val); save(); render(true);
    }));
    app.querySelectorAll('[data-delete-routine]').forEach(b => b.addEventListener('click', () => {
      if (!confirm('Eliminare scheda?')) return;
      state.routines = state.routines.filter(r => r.id !== b.dataset.deleteRoutine); ui.editingRoutine = null; save(); render(true);
    }));

    // Workout
    app.querySelectorAll('[data-rest]').forEach(b => b.addEventListener('click', () => startRestTimer(Number(b.dataset.rest))));
    app.querySelectorAll('[data-save-ex]').forEach(b => b.addEventListener('click', () => saveSingleExercise(Number(b.dataset.saveEx))));
    app.querySelectorAll('[data-add-set]').forEach(b => b.addEventListener('click', () => { const ei = Number(b.dataset.addSet); state.session.exercises[ei].sets.push({ kg: '', reps: '' }); state.session.exercises[ei].saved = false; save(); render(true); }));
    app.querySelectorAll('[data-remove-set]').forEach(b => b.addEventListener('click', () => {
      const [ei, si] = b.dataset.removeSet.split('-').map(Number), sets = state.session.exercises[ei].sets;
      if (sets.length <= 1) { toast('Almeno una serie'); return; }
      sets.splice(si, 1); state.session.exercises[ei].saved = false; save(); render(true);
    }));
    app.querySelectorAll('[data-remove-ex]').forEach(b => b.addEventListener('click', () => { state.session.exercises.splice(Number(b.dataset.removeEx), 1); syncSessionToHistory(); save(); render(true); }));
    app.querySelectorAll('input[data-ex]').forEach(inp => inp.addEventListener('input', () => {
      const ei = Number(inp.dataset.ex), si = Number(inp.dataset.set), f = inp.dataset.field;
      state.session.exercises[ei].sets[si][f] = inp.value; state.session.exercises[ei].saved = false;
      const btn = app.querySelector(`[data-save-ex="${ei}"]`);
      if (btn) { btn.classList.remove('done'); btn.textContent = '✓ Salva'; }
      app.querySelector(`[data-ex-card="${ei}"]`)?.classList.remove('is-saved');
      save(); if (f === 'reps') updateDeltas(ei);
    }));
    app.querySelector('#new-exercise')?.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addExercise(); } });

    // Charts & History
    app.querySelectorAll('[data-muscle]').forEach(b => b.addEventListener('click', () => { ui.muscle = b.dataset.muscle; ui.exerciseFilter = 'all'; ui.chartPoint = null; render(true); }));
    app.querySelector('#exercise-filter')?.addEventListener('change', e => { ui.exerciseFilter = e.target.value; ui.chartPoint = null; render(true); });
    app.querySelectorAll('[data-metric]').forEach(b => b.addEventListener('click', () => { ui.metric = b.dataset.metric; render(true); }));
    app.querySelectorAll('[data-chart-pt]').forEach(g => g.addEventListener('click', () => { ui.chartPoint = Number(g.dataset.chartPt); render(true); }));
    app.querySelectorAll('[data-delete-session]').forEach(b => b.addEventListener('click', () => {
      if (!confirm('Eliminare seduta?')) return;
      state.history = state.history.filter(s => s.id !== b.dataset.deleteSession); save(); render(true);
    }));

    // Exercise search & detail
    app.querySelector('#ex-search-input')?.addEventListener('input', e => {
      ui.exSearch = e.target.value; render(true);
      const i = app.querySelector('#ex-search-input'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
    });
    app.querySelector('#ex-group-select')?.addEventListener('change', e => { if (ui.selectedExercise) { state.exerciseGroups[ui.selectedExercise.trim().toLowerCase()] = e.target.value; save(); toast('Gruppo aggiornato'); } });
    app.querySelectorAll('[data-del-ex-entry]').forEach(b => b.addEventListener('click', () => {
      const [sid, exIdx] = b.dataset.delExEntry.split(':'); if (!confirm('Rimuovere?')) return;
      const s = state.history.find(x => x.id === sid);
      if (s) { s.exercises.splice(Number(exIdx), 1); if (!s.exercises.length) state.history = state.history.filter(x => x.id !== sid); save(); render(true); }
    }));

    // Import
    app.querySelectorAll('[data-import-tab]').forEach(b => b.addEventListener('click', () => { ui.importTab = b.dataset.importTab; render(true); }));
    app.querySelector('#note-import-text')?.addEventListener('input', e => { ui.noteText = e.target.value; });
    app.querySelector('#manual-date')?.addEventListener('change', e => { ui.manualDate = e.target.value; });
    app.querySelector('#manual-routine')?.addEventListener('change', e => { ui.manualRoutineId = e.target.value; ui.manualSets = {}; render(true); });
    app.querySelectorAll('[data-m-ex]').forEach(inp => inp.addEventListener('input', () => {
      const n = inp.dataset.mEx, si = Number(inp.dataset.mSet), f = inp.dataset.mField;
      if (!ui.manualSets[n]) ui.manualSets[n] = [{ kg: '', reps: '' }, { kg: '', reps: '' }];
      ui.manualSets[n][si][f] = inp.value;
    }));
    app.querySelector('#import-file')?.addEventListener('change', importBackup);
  }

  function startRestTimer(sec) {
    clearInterval(restTimerInterval);
    ui.restOpen = false;
    if (sec <= 0) { restSecondsLeft = 0; render(true); return; }
    restSecondsLeft = sec;
    render(true);
    restTimerInterval = setInterval(() => {
      restSecondsLeft--;
      const el = document.getElementById('timer-display');
      const isl = document.getElementById('island-timer');
      if (restSecondsLeft <= 0) {
        clearInterval(restTimerInterval); restSecondsLeft = 0;
        if (el) { el.classList.remove('running'); el.textContent = '⏱ Recupero'; }
        if (isl) isl.textContent = 'Riprendi →';
        toast('Recupero terminato!');
        if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
      } else {
        const txt = `⏱ ${formatTimer(restSecondsLeft)}`;
        if (el) { el.classList.add('running'); el.textContent = txt; }
        if (isl) isl.textContent = txt;
      }
    }, 1000);
  }

  function updateDeltas(ei) {
    const ex = state.session.exercises[ei], prev = lastForExercise(ex.name, state.session.id)?.sets || [];
    ex.sets.forEach((set, si) => {
      const el = app.querySelector(`[data-delta="${ei}-${si}"]`);
      if (!el) return;
      const c = repsChange(set.reps, prev[si]?.reps);
      el.className = `change-mark ${c.cls}`; el.textContent = c.label;
    });
  }

  function syncSessionToHistory(includeAllFilled = false) {
    if (!state.session) return 0;
    const exercises = state.session.exercises
      .filter(e => includeAllFilled ? e.sets.some(s => String(s.reps).trim() !== '') : e.saved)
      .map(e => ({ name: e.name, sets: e.sets.filter(s => String(s.reps).trim() !== '').map(s => ({ kg: String(s.kg).trim() === '' ? null : Number(s.kg), reps: Number(s.reps) })) }))
      .filter(e => e.sets.length > 0);
    const idx = state.history.findIndex(h => h.id === state.session.id);
    if (!exercises.length) { if (idx >= 0) state.history.splice(idx, 1); return 0; }
    const rec = { id: state.session.id, routineId: state.session.routineId, routineName: state.session.routineName, date: state.session.date, startedAt: state.session.startedAt, finishedAt: new Date().toISOString(), exercises };
    if (idx >= 0) state.history[idx] = rec; else state.history.push(rec);
    return exercises.length;
  }

  function saveSingleExercise(ei) {
    const ex = state.session?.exercises?.[ei];
    if (!ex || !ex.sets.some(s => String(s.reps).trim() !== '')) { toast('Inserisci almeno le ripetizioni'); return; }
    ex.saved = true; syncSessionToHistory(false); save(); render(true); toast(`${ex.name} memorizzato ✓`);
  }

  function startSession(routineId) {
    if (state.session) {
      if (state.session.routineId === routineId) { state.screen = 'workout'; save(); render(false); return; }
      if (!confirm(`Hai "${state.session.routineName}" in corso. Iniziare comunque una nuova seduta?`)) return;
    }
    const r = state.routines.find(x => x.id === routineId); if (!r) return;
    ui.muscleModalSide = /pull/i.test(r.name) ? 'back' : 'front';
    state.session = {
      id: uid(), routineId: r.id, routineName: r.name, date: today(), startedAt: new Date().toISOString(),
      exercises: r.exercises.map(name => {
        const p = lastForExercise(name);
        return { name, saved: false, sets: p?.sets?.length ? p.sets.map(s => ({ kg: s.kg == null ? '' : String(s.kg), reps: String(s.reps ?? '') })) : [{ kg: '', reps: '' }, { kg: '', reps: '' }] };
      })
    };
    state.screen = 'workout'; save(); render(false);
  }

  function addExercise() {
    const input = app.querySelector('#new-exercise'), name = input?.value.trim();
    if (!name) return;
    if (state.session.exercises.some(e => e.name.toLowerCase() === name.toLowerCase())) { toast('Già presente'); return; }
    const p = lastForExercise(name, state.session.id);
    state.session.exercises.push({ name, saved: false, sets: p?.sets?.length ? p.sets.map(s => ({ kg: s.kg == null ? '' : String(s.kg), reps: String(s.reps ?? '') })) : [{ kg: '', reps: '' }, { kg: '', reps: '' }] });
    save(); render(true); toast('Aggiunto per oggi');
  }

  function action(name) {
    if (name === 'toggle-home-week') { ui.homeWeekOpen = !ui.homeWeekOpen; render(true); return; }
    if (name === 'resume-session') { state.screen = 'workout'; save(); render(false); return; }
    if (name === 'open-exercises') { state.screen = 'exercises'; render(false); return; }
    if (name === 'open-import') { state.screen = 'import'; render(false); return; }
    if (name === 'back-from-ex') { state.screen = ui.prevScreenForEx || 'exercises'; render(false); return; }
    if (name === 'open-muscle-modal') { ui.muscleModalOpen = true; render(true); return; }
    if (name === 'close-muscle-modal') { ui.muscleModalOpen = false; render(true); return; }
    if (name === 'toggle-katana') { state.katanaIntro = !state.katanaIntro; save(); render(true); return; }
    if (name === 'replay-katana') { ui.showSplash = true; render(false); return; }
    if (name === 'toggle-add-routine') { ui.addingRoutine = !ui.addingRoutine; render(true); return; }
    if (name === 'create-routine') {
      const val = app.querySelector('#new-routine-name')?.value.trim(); if (!val) return;
      state.routines.push({ id: 'r-' + uid(), name: val, tag: 'PERSONALIZZATA', theme: 'spartan-outline', exercises: ['Esercizio 1'] });
      ui.addingRoutine = false; save(); render(true); return;
    }
    if (name === 'add-exercise') { addExercise(); return; }
    if (name === 'toggle-rest') { ui.restOpen = !ui.restOpen; render(true); return; }
    if (name === 'cancel-session') {
      if (confirm('Chiudere la sessione attiva? Gli esercizi salvati restano nello storico.')) {
        clearInterval(restTimerInterval); restSecondsLeft = 0; state.session = null; state.screen = 'home'; save(); render(false);
      }
      return;
    }
    if (name === 'save-session') {
      const count = syncSessionToHistory(true);
      if (!count) { toast('Inserisci almeno una serie'); return; }
      clearInterval(restTimerInterval); restSecondsLeft = 0; state.session = null; state.screen = 'home'; save(); render(false);
      toast(`Seduta completata (${count} esercizi) ✓`); return;
    }
    if (name === 'save-ex-update') {
      const sets = [0, 1].map(i => ({ kg: app.querySelector(`#ex-upd-kg-${i}`)?.value.trim(), reps: app.querySelector(`#ex-upd-rep-${i}`)?.value.trim() }))
        .filter(s => s.reps !== '').map(s => ({ kg: s.kg === '' ? null : Number(s.kg), reps: Number(s.reps) }));
      if (!sets.length) { toast('Inserisci le ripetizioni'); return; }
      state.history.push({ id: 'upd-' + uid(), routineId: 'manual', routineName: 'Aggiornamento Carico', date: app.querySelector('#ex-upd-date')?.value || today(), finishedAt: new Date().toISOString(), exercises: [{ name: ui.selectedExercise, sets }] });
      save(); render(true); toast('Carico aggiornato ✓'); return;
    }
    if (name === 'parse-note') { if (ui.noteText.trim()) { ui.parsedNoteSessions = parseNoteText(ui.noteText); render(true); } return; }
    if (name === 'confirm-note-import') {
      if (!ui.parsedNoteSessions?.length) return;
      state.history.push(...ui.parsedNoteSessions); const n = ui.parsedNoteSessions.length;
      ui.parsedNoteSessions = null; ui.noteText = ''; state.screen = 'progress'; save(); render(false); toast(`${n} sedute importate ✓`); return;
    }
    if (name === 'save-manual-session') {
      const r = state.routines.find(x => x.id === ui.manualRoutineId) || state.routines[0];
      const d = app.querySelector('#manual-date')?.value || ui.manualDate || today();
      const exercises = r.exercises.map(exName => ({
        name: exName, sets: (ui.manualSets[exName] || []).filter(s => String(s.reps).trim() !== '').map(s => ({ kg: String(s.kg).trim() === '' ? null : Number(s.kg), reps: Number(s.reps) }))
      })).filter(e => e.sets.length > 0);
      if (!exercises.length) { toast('Compila almeno un esercizio'); return; }
      state.history.push({ id: 'man-' + uid(), routineId: r.id, routineName: r.name, date: d, finishedAt: new Date().toISOString(), exercises });
      ui.manualSets = {}; state.screen = 'progress'; save(); render(false); toast('Seduta salvata ✓'); return;
    }
    if (name === 'goal-up') { state.goal = Math.min(7, state.goal + 1); save(); render(true); return; }
    if (name === 'goal-down') { state.goal = Math.max(1, state.goal - 1); save(); render(true); return; }
    if (name === 'export') { exportBackup(); return; }
    if (name === 'import') { app.querySelector('#import-file')?.click(); return; }
    if (name === 'load-demo') { loadDemoData(); return; }
    if (name === 'clear-demo') { state.history = state.history.filter(s => !s.isDemo); ui.chartPoint = null; save(); render(true); toast('Demo rimossi'); return; }
  }

  function loadDemoData() {
    const daysAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
    state.history.push(
      { id: 'demo1', isDemo: true, routineId: 'push', routineName: 'Push Day', date: daysAgo(12), finishedAt: 'T18:00', exercises: [{ name: 'Pec deck', sets: [{ kg: 55, reps: 10 }, { kg: 55, reps: 9 }] }, { name: 'Panca inclinata', sets: [{ kg: 60, reps: 8 }, { kg: 60, reps: 8 }] }] },
      { id: 'demo2', isDemo: true, routineId: 'pull', routineName: 'Pull Day', date: daysAgo(9), finishedAt: 'T18:00', exercises: [{ name: 'Lat machine', sets: [{ kg: 60, reps: 10 }, { kg: 60, reps: 9 }] }, { name: 'Biceps preacher', sets: [{ kg: 25, reps: 10 }, { kg: 25, reps: 9 }] }] },
      { id: 'demo3', isDemo: true, routineId: 'legs', routineName: 'Leg Day', date: daysAgo(6), finishedAt: 'T18:00', exercises: [{ name: 'Leg press (Squat)', sets: [{ kg: 120, reps: 10 }, { kg: 120, reps: 10 }] }, { name: 'Reverse curl', sets: [{ kg: 15, reps: 12 }, { kg: 15, reps: 11 }] }] },
      { id: 'demo4', isDemo: true, routineId: 'upper', routineName: 'Upper Day', date: daysAgo(2), finishedAt: 'T18:00', exercises: [{ name: 'Panca inclinata', sets: [{ kg: 65, reps: 8 }, { kg: 65, reps: 8 }] }, { name: 'Row presa stretta', sets: [{ kg: 55, reps: 10 }, { kg: 55, reps: 10 }] }] }
    );
    save(); render(true); toast('Dati di prova caricati');
  }

  function exportBackup() {
    const blob = new Blob([JSON.stringify({ version: 4, exportedAt: new Date().toISOString(), profile: state.profile, activeSplit: state.activeSplit, routines: state.routines, history: state.history, exerciseGroups: state.exerciseGroups, goal: state.goal }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `replog-backup-${today()}.json`; a.click(); URL.revokeObjectURL(a.href); toast('Backup esportato');
  }

  function importBackup(event) {
    const file = event.target.files?.[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!Array.isArray(data.history) || !Array.isArray(data.routines)) throw new Error('invalid');
        if (!confirm('Importare questo backup?')) return;
        state = { ...state, profile: data.profile || state.profile, activeSplit: data.activeSplit || state.activeSplit, routines: data.routines, history: data.history, exerciseGroups: data.exerciseGroups || {}, goal: Number(data.goal) || 4, screen: 'profile', session: null };
        save(); render(false); toast('Backup importato');
      } catch { toast('File non valido'); } finally { event.target.value = ''; }
    };
    reader.readAsText(file);
  }

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }

  render(false);
})();
</script>
