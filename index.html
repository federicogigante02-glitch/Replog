```html
<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070709">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RepLog">
  <meta name="description" content="Diario personale di forza e disciplina per registrare allenamenti, carichi e progressioni.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <title>RepLog — Disciplina &amp; Forza</title>
  <style>
    :root{
      color-scheme:dark;
      --bg:#070709;
      --surface:#0e0e12;
      --surface-2:#14141a;
      --surface-3:#1c1c24;
      --text:#f3efe6;
      --muted:#8a857e;
      --line:rgba(255,255,255,.085);
      --line-red:rgba(220,31,46,.38);
      --crimson:#dc1f2e;
      --crimson-bright:#ff2d3d;
      --crimson-deep:#680b13;
      --gold:#c9a96e;
      --blue:#55c8f4;
      --orange:#ff8b58;
      --purple:#c09eff;
      --green:#6ed4a4;
      --radius:2px;
      --shadow:0 18px 46px rgba(0,0,0,.55);
      --font-display:"Cinzel",Georgia,"Times New Roman",serif;
      --font-sans:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html{background:var(--bg)}
    body{
      margin:0;
      background:
        radial-gradient(circle at 80% -10%, rgba(220,31,46,.14), transparent 38%),
        radial-gradient(circle at 10% 100%, rgba(120,10,20,.12), transparent 40%),
        var(--bg);
      color:var(--text);
      font-family:var(--font-sans);
      font-size:15px;
      line-height:1.45;
      min-height:100vh;
      -webkit-font-smoothing:antialiased;
    }
    button,input,select,textarea{font:inherit}
    button{color:inherit}

    .app{
      max-width:480px;
      height:100vh;
      height:100dvh;
      min-height:0;
      margin:0 auto;
      position:relative;
      display:flex;
      flex-direction:column;
      overflow:hidden;
      background:linear-gradient(180deg, rgba(255,255,255,.015), transparent 16%);
      border-left:1px solid rgba(255,255,255,.04);
      border-right:1px solid rgba(255,255,255,.04);
    }

    .topbar{
      padding:calc(16px + env(safe-area-inset-top)) 20px 12px;
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      border-bottom:1px solid rgba(255,255,255,.06);
      background:rgba(7,7,9,.92);
      backdrop-filter:blur(14px);
      z-index:10;flex:0 0 auto;
    }
    .brand{display:flex;align-items:center;gap:11px;min-width:0}
    .brand-mark{
      width:36px;height:36px;
      background:linear-gradient(145deg, var(--crimson), var(--crimson-deep));
      border:1px solid rgba(255,100,110,.4);
      display:grid;place-items:center;
      font-family:var(--font-display);
      font-weight:800;font-size:17px;color:#fff;
      clip-path:polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
      box-shadow:0 0 22px rgba(220,31,46,.3);
    }
    .brand-name{font-family:var(--font-display);font-size:17px;letter-spacing:.16em;font-weight:800}
    .brand-sub{font-size:10px;color:var(--gold);letter-spacing:.22em;text-transform:uppercase;margin-top:1px;font-weight:700}
    .avatar{
      width:36px;height:36px;display:grid;place-items:center;
      background:var(--surface-2);border:1px solid var(--line-red);
      font-family:var(--font-display);font-size:12px;font-weight:700;letter-spacing:.08em;
      clip-path:polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    }

    /* BANNER SESSIONE ATTIVA SEMPRE VISIBILE */
    .active-banner{
      flex:0 0 auto;
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      padding:9px 18px;
      background:linear-gradient(90deg, rgba(220,31,46,.22), rgba(104,11,19,.25));
      border-bottom:1px solid var(--crimson);
      cursor:pointer;
    }
    .active-banner-left{display:flex;align-items:center;gap:8px;min-width:0;font-size:12px;font-weight:700}
    .pulse-dot{width:8px;height:8px;background:var(--crimson-bright);box-shadow:0 0 8px var(--crimson-bright);flex:0 0 8px}
    .active-banner-cta{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);white-space:nowrap}

    main{
      padding:0 18px 28px;
      flex:1 1 auto;min-height:0;overflow-y:auto;
      overscroll-behavior:contain;scrollbar-width:none;
    }
    main::-webkit-scrollbar{display:none}

    .eyebrow{font-size:10px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
    .greeting{padding:14px 2px 12px}
    h1{
      font-family:var(--font-display);font-size:26px;line-height:1.12;
      letter-spacing:.03em;margin:5px 0 6px;font-weight:700;text-transform:uppercase;
    }
    h2{font-size:18px;line-height:1.2;letter-spacing:.02em;margin:0;font-weight:700}
    h3{font-size:15px;line-height:1.25;margin:0;font-weight:700}
    p{margin:0}
    .muted{color:var(--muted)}
    .tiny{font-size:12px;color:var(--muted)}

    /* SELETTORE RAPIDO GIORNO SU HOME */
    .day-switcher{
      display:flex;gap:5px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none;
    }
    .day-switcher::-webkit-scrollbar{display:none}
    .day-tab{
      flex:1 0 auto;min-width:68px;
      border:1px solid var(--line);background:var(--surface-2);
      padding:7px 9px;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
      color:var(--muted);cursor:pointer;text-align:center;
    }
    .day-tab.active{
      border-color:var(--crimson);
      background:rgba(220,31,46,.16);
      color:#fff;
    }

    /* HERO */
    .hero{
      position:relative;overflow:hidden;border-radius:var(--radius);padding:20px;
      background:linear-gradient(135deg, #131217 0%, #0b0b0e 65%, #17090c 100%);
      border:1px solid rgba(255,255,255,.1);border-left:3px solid var(--crimson);
      box-shadow:var(--shadow);min-height:204px;
      display:flex;flex-direction:column;justify-content:space-between;
    }
    .hero::before{
      content:"";position:absolute;right:-22px;top:50%;transform:translateY(-50%);
      width:182px;height:182px;border-radius:50%;
      background:radial-gradient(circle at 45% 45%, #e5202f 0%, #9b101b 58%, rgba(120,10,20,0) 74%);
      opacity:.9;pointer-events:none;
    }
    .hero::after{
      content:"MMXXVI";position:absolute;left:20px;bottom:12px;
      font-family:var(--font-display);font-size:9px;letter-spacing:.35em;
      color:rgba(255,255,255,.2);pointer-events:none;
    }
    .hero-art{
      position:absolute;right:6px;bottom:-4px;width:142px;height:180px;
      pointer-events:none;opacity:.95;filter:drop-shadow(-6px 6px 16px rgba(0,0,0,.85));
    }
    .hero-content{position:relative;z-index:2;max-width:236px}
    .hero-kicker{
      color:var(--crimson-bright);font-size:10px;letter-spacing:.22em;text-transform:uppercase;font-weight:800;
      display:flex;align-items:center;gap:8px;
    }
    .hero-kicker::before{content:"";width:18px;height:1px;background:var(--crimson-bright);display:inline-block}
    .hero h2{
      font-family:var(--font-display);font-size:25px;margin:9px 0 5px;
      letter-spacing:.05em;text-transform:uppercase;color:#fff;
    }
    .hero-meta{color:#b8b2aa;font-size:13px;line-height:1.4}
    .hero-rule{display:flex;align-items:center;gap:8px;margin:12px 0 0;font-size:10px;letter-spacing:.18em;color:var(--muted)}
    .hero-rule span.bar{flex:0 0 38px;height:1px;background:rgba(255,255,255,.25)}
    .hero-cta{
      margin-top:15px;min-height:44px;border:0;padding:0 18px;
      background:linear-gradient(100deg, var(--crimson), #b8121f);
      font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#fff;
      display:inline-flex;align-items:center;gap:10px;cursor:pointer;
      clip-path:polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
      box-shadow:0 8px 26px rgba(220,31,46,.32);
    }
    .hero-cta:active,.primary-button:active,.secondary-button:active,.arrow-button:active{transform:scale(.97)}

    .section-head{
      display:flex;align-items:center;justify-content:space-between;
      margin:22px 2px 11px;gap:10px;
      border-bottom:1px solid rgba(255,255,255,.06);padding-bottom:7px;
    }
    .section-head h2{
      font-family:var(--font-display);font-size:14px;letter-spacing:.14em;text-transform:uppercase;
    }
    .text-button{
      border:0;background:none;color:var(--crimson-bright);padding:4px 2px;
      font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;
    }

    .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .stat-card{
      border-radius:var(--radius);background:var(--surface-2);
      border:1px solid var(--line);border-top:2px solid rgba(220,31,46,.45);padding:13px;
    }
    .stat-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
    .stat-roman{font-family:var(--font-display);font-size:11px;color:var(--gold);font-weight:700}
    .stat-value{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:7px;font-variant-numeric:tabular-nums;color:#fff}
    .stat-value small{font-size:12px;color:var(--muted);font-weight:600}

    .routine-list{display:grid;gap:8px}
    .routine-card{
      border:1px solid var(--line);border-left:2px solid var(--crimson);
      background:linear-gradient(90deg, rgba(220,31,46,.05), var(--surface-2) 45%);
      padding:12px 14px;display:flex;align-items:center;gap:13px;
    }
    .routine-num{
      width:36px;height:36px;flex:0 0 36px;display:grid;place-items:center;
      font-family:var(--font-display);font-size:13px;font-weight:800;color:var(--crimson-bright);
      background:rgba(220,31,46,.1);border:1px solid var(--line-red);
      clip-path:polygon(0 0, calc(100% - 7px) 0, 100% 7px, 100% 100%, 7px 100%, 0 calc(100% - 7px));
    }
    .routine-info{min-width:0;flex:1}
    .routine-info h3{font-family:var(--font-display);font-size:15px;letter-spacing:.06em;text-transform:uppercase}
    .routine-info .tiny{margin-top:2px;font-size:12px}
    .arrow-button{
      width:38px;height:38px;flex:0 0 38px;border:1px solid rgba(255,255,255,.14);
      background:var(--surface-3);display:grid;place-items:center;font-size:18px;cursor:pointer;
    }

    .last-session{
      margin-top:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);
      display:flex;align-items:center;justify-content:space-between;gap:12px;
    }
    .last-main{min-width:0}
    .last-main strong{display:block;font-size:13px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .last-tag{
      font-family:var(--font-display);font-size:10px;letter-spacing:.12em;padding:5px 8px;
      border:1px solid rgba(110,212,164,.3);color:var(--green);background:rgba(110,212,164,.08);text-transform:uppercase;
    }

    .tabbar{
      position:relative;z-index:30;width:100%;flex:0 0 auto;
      padding:4px 10px calc(8px + env(safe-area-inset-bottom));
      background:rgba(10,10,13,.98);backdrop-filter:blur(20px);
      border-top:1px solid rgba(255,255,255,.08);
      display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
    }
    .tab{
      position:relative;border:0;background:transparent;min-height:54px;color:#6f6a64;
      display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;
      font-size:10px;font-weight:750;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;
    }
    .tab svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}
    .tab.active{color:var(--text)}
    .tab.active svg{stroke:var(--crimson-bright)}
    .tab.active::before{
      content:"";position:absolute;top:-4px;left:22%;right:22%;height:2px;
      background:var(--crimson-bright);box-shadow:0 0 12px var(--crimson);
    }

    .page-title{
      padding:14px 2px 13px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;
      border-bottom:1px solid rgba(255,255,255,.06);margin-bottom:14px;
    }
    .page-title h1{margin:4px 0 0;font-size:23px}
    .pill{
      display:inline-flex;align-items:center;gap:6px;padding:5px 10px;
      background:var(--surface-2);color:var(--gold);
      font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
      border:1px solid rgba(201,169,110,.28);white-space:nowrap;
    }

    .routine-large{
      background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--crimson);
      padding:15px;margin-bottom:12px;
    }
    .routine-large-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
    .routine-large h2{font-family:var(--font-display);font-size:17px;letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
    .exercise-preview{display:flex;flex-wrap:wrap;gap:6px;margin:11px 0 13px}
    .exercise-chip{
      background:var(--surface);border:1px solid rgba(255,255,255,.08);
      padding:5px 8px;color:#cec8be;font-size:12px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;
    }
    .exercise-chip:hover{border-color:rgba(201,169,110,.4)}
    .chip-del{border:0;background:transparent;color:var(--crimson-bright);font-size:14px;line-height:1;padding:0 2px;cursor:pointer}

    .button-row{display:flex;gap:8px;align-items:center}
    .primary-button,.secondary-button,.danger-button,.success-button{
      min-height:44px;padding:0 14px;border:0;
      font-weight:800;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
      cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;
    }
    .primary-button{
      background:linear-gradient(100deg, var(--crimson), #b3121e);color:#fff;
      clip-path:polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
      box-shadow:0 8px 22px rgba(220,31,46,.24);
    }
    .secondary-button{background:var(--surface-3);border:1px solid rgba(255,255,255,.12);color:var(--text)}
    .danger-button{background:rgba(220,31,46,.12);border:1px solid var(--line-red);color:#ff848d}
    .success-button{background:rgba(110,212,164,.14);border:1px solid rgba(110,212,164,.4);color:var(--green)}
    .small-btn{min-height:34px;padding:0 10px;font-size:10px}
    .full{width:100%}

    .note-card{
      padding:11px 13px;background:rgba(255,255,255,.025);
      border-left:2px solid var(--gold);border-top:1px solid var(--line);
      border-right:1px solid var(--line);border-bottom:1px solid var(--line);
      color:#ccc5ba;font-size:12px;margin:0 0 13px;
    }

    /* WORKOUT */
    .workout-head{padding:12px 0 12px}
    .back-button{
      min-width:40px;height:40px;border:1px solid rgba(255,255,255,.14);
      background:var(--surface-2);font-size:20px;cursor:pointer;display:grid;place-items:center;
    }
    .workout-toprow{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .workout-titlewrap{display:flex;align-items:center;gap:11px;min-width:0}
    .workout-toprow h1{font-size:20px;margin:2px 0 0}
    .workout-date{font-size:12px;color:var(--muted);margin:5px 0 0 51px;text-transform:capitalize}
    .rest-pill{
      border:1px solid var(--line-red);background:rgba(220,31,46,.1);color:var(--text);
      padding:6px 10px;font-size:11px;font-weight:700;letter-spacing:.08em;
      display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums;
    }
    .rest-pill.running{background:var(--crimson);color:#fff;box-shadow:0 0 16px rgba(220,31,46,.45)}
    .rest-bar{display:flex;gap:6px;margin:9px 0 0 51px;flex-wrap:wrap}
    .rest-chip{border:1px solid var(--line);background:var(--surface-2);padding:4px 9px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer}

    .exercise-card{
      background:var(--surface-2);border:1px solid var(--line);border-left:2px solid var(--crimson);
      padding:13px;margin:0 0 11px;transition:border-color .15s ease;
    }
    .exercise-card.is-saved{
      border-left:3px solid var(--green);
      background:linear-gradient(90deg, rgba(110,212,164,.05), var(--surface-2) 45%);
    }
    .exercise-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .exercise-title{display:flex;align-items:center;gap:9px;min-width:0}
    .exercise-number{
      width:28px;height:28px;background:rgba(220,31,46,.14);border:1px solid var(--line-red);
      color:var(--crimson-bright);font-family:var(--font-display);font-size:11px;font-weight:800;
      display:grid;place-items:center;flex:0 0 28px;
    }
    .exercise-card.is-saved .exercise-number{
      background:rgba(110,212,164,.14);border-color:rgba(110,212,164,.4);color:var(--green);
    }
    .exercise-title h3{font-size:15px}
    .exercise-actions{display:flex;align-items:center;gap:6px}
    .save-ex-btn{
      border:1px solid var(--line-red);background:rgba(220,31,46,.14);color:#fff;
      padding:6px 10px;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
      cursor:pointer;white-space:nowrap;
    }
    .save-ex-btn.done{
      border-color:rgba(110,212,164,.45);background:rgba(110,212,164,.16);color:var(--green);
    }
    .remove-exercise{border:0;background:transparent;color:var(--muted);font-size:18px;width:28px;height:30px;cursor:pointer}

    .previous{
      margin:9px 0 10px;padding:7px 10px;background:var(--surface);border:1px solid rgba(255,255,255,.05);
      font-size:12px;color:#ada79e;
    }
    .previous strong{color:var(--text);font-weight:700}
    .previous-title{font-size:9px;text-transform:uppercase;letter-spacing:.16em;color:var(--gold);margin-bottom:2px;font-weight:800}

    .set-head,.set-row{display:grid;grid-template-columns:32px minmax(70px,1fr) minmax(70px,1fr) 34px 26px;gap:6px;align-items:center}
    .set-head{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0 2px 6px;font-weight:800}
    .set-row{padding:5px 0;border-top:1px solid rgba(255,255,255,.05)}
    .set-label{font-family:var(--font-display);font-size:12px;color:var(--gold);font-weight:700;padding-left:4px}
    .input-wrap{position:relative}
    .input-wrap input{
      width:100%;height:42px;border:1px solid rgba(255,255,255,.11);background:#09090c;color:var(--text);
      outline:none;padding:0 26px 0 10px;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;
      appearance:textfield;-moz-appearance:textfield;
    }
    .input-wrap input::-webkit-outer-spin-button,.input-wrap input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
    .input-wrap input:focus{border-color:var(--crimson);box-shadow:0 0 0 2px rgba(220,31,46,.18)}
    .weight-input input{color:var(--purple)}
    .reps-input input{color:#dff4ff}
    .input-unit{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:10px;color:#78736c;pointer-events:none}

    .change-mark{min-height:24px;min-width:30px;display:grid;place-items:center;font-size:11px;font-weight:800;font-variant-numeric:tabular-nums}
    .change-mark.up{color:var(--blue);background:rgba(85,200,244,.12);border:1px solid rgba(85,200,244,.25)}
    .change-mark.down{color:var(--orange);background:rgba(255,139,88,.12);border:1px solid rgba(255,139,88,.25)}
    .change-mark.same{color:#9a948c;background:rgba(255,255,255,.05)}
    .change-mark.none{opacity:0}
    .set-delete{width:28px;height:34px;border:0;background:transparent;color:#7a756d;font-size:18px;cursor:pointer}
    .ex-card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
    .add-set{border:0;background:transparent;color:var(--gold);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;min-height:32px;padding:0 2px;cursor:pointer}

    .add-exercise-panel{margin:8px 0 16px;padding:13px;border:1px dashed rgba(255,255,255,.18);background:rgba(255,255,255,.015)}
    .form-input,.form-select,.form-textarea,.add-exercise-panel input{
      width:100%;height:42px;border:1px solid rgba(255,255,255,.12);background:#09090c;color:var(--text);
      padding:0 12px;font-size:14px;outline:none;
    }
    .form-textarea{height:150px;padding:11px 12px;resize:vertical;line-height:1.5}
    .form-input:focus,.form-select:focus,.form-textarea:focus,.add-exercise-panel input:focus{border-color:var(--crimson)}
    .save-bar{padding:8px 0 10px;display:grid;gap:8px}
    .save-button{height:50px;font-size:12px}

    /* CHARTS */
    .filter-scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:0 -2px 10px;scrollbar-width:none}
    .filter-scroll::-webkit-scrollbar{display:none}
    .filter-chip{
      flex:0 0 auto;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);
      padding:7px 11px;font-size:11px;font-weight:750;letter-spacing:.09em;text-transform:uppercase;
      cursor:pointer;display:inline-flex;align-items:center;gap:6px;
    }
    .filter-chip .roman{font-family:var(--font-display);font-size:10px;color:var(--gold);opacity:.7}
    .filter-chip.active{
      background:linear-gradient(135deg, rgba(220,31,46,.22), rgba(220,31,46,.08));
      border-color:var(--crimson);color:#fff;
    }
    .filter-chip.active .roman{color:var(--crimson-bright);opacity:1}

    .metric-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:12px}
    .metric-btn{
      border:1px solid var(--line);background:var(--surface);padding:8px 4px;
      font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer;text-align:center;
    }
    .metric-btn.active{background:var(--surface-3);border-color:var(--gold);color:var(--gold)}

    .chart-box{background:linear-gradient(180deg, #131319 0%, #0d0d11 100%);border:1px solid var(--line);border-top:2px solid var(--crimson);padding:14px;margin-bottom:14px}
    .chart-header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
    .chart-big{font-size:24px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
    .chart-big small{font-size:12px;color:var(--muted);font-weight:600}
    .trend-badge{padding:4px 8px;font-size:11px;font-weight:800;letter-spacing:.06em;font-variant-numeric:tabular-nums}
    .trend-badge.up{color:var(--blue);background:rgba(85,200,244,.12);border:1px solid rgba(85,200,244,.3)}
    .trend-badge.down{color:var(--orange);background:rgba(255,139,88,.12);border:1px solid rgba(255,139,88,.3)}
    .trend-badge.flat{color:var(--muted);background:rgba(255,255,255,.05);border:1px solid var(--line)}
    .chart-svg{width:100%;height:185px;display:block;overflow:visible}
    .chart-readout{
      margin-top:10px;padding:9px 11px;background:var(--surface);border:1px solid rgba(255,255,255,.07);
      display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;
    }

    .muscle-bars{display:grid;gap:8px}
    .mbar-row{background:var(--surface-2);border:1px solid var(--line);padding:10px 12px}
    .mbar-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px}
    .mbar-track{height:5px;background:#09090c;overflow:hidden}
    .mbar-fill{height:100%;background:linear-gradient(90deg, var(--crimson-deep), var(--crimson-bright))}

    .record-list{display:grid;gap:7px}
    .record-row{
      display:flex;justify-content:space-between;align-items:center;gap:10px;
      padding:11px 12px;background:var(--surface-2);border:1px solid var(--line);border-left:2px solid var(--gold);cursor:pointer;
    }
    .record-row strong{color:var(--gold);font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}

    .history-card{padding:13px;margin-bottom:9px;border:1px solid var(--line);background:var(--surface-2)}
    .history-top{display:flex;justify-content:space-between;gap:10px;align-items:center}
    .history-top strong{font-family:var(--font-display);font-size:14px;letter-spacing:.05em;text-transform:uppercase}
    .history-date{font-size:11px;color:var(--muted);white-space:nowrap}
    .history-detail{font-size:12px;color:#ada79e;margin-top:7px;line-height:1.55}

    .empty-state{padding:22px 16px;border:1px dashed rgba(255,255,255,.15);text-align:center;color:var(--muted);background:rgba(255,255,255,.015)}
    .empty-icon{
      width:44px;height:44px;margin:0 auto 10px;border:1px solid var(--line-red);
      background:rgba(220,31,46,.1);color:var(--crimson-bright);display:grid;place-items:center;
      font-family:var(--font-display);font-size:18px;font-weight:800;
    }

    .profile-card{padding:14px;background:var(--surface-2);border:1px solid var(--line);margin-bottom:11px}
    .profile-card h3{font-family:var(--font-display);font-size:14px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px}
    .goal-controls{display:flex;align-items:center;gap:12px;margin-top:10px}
    .goal-controls button{width:40px;height:40px;border:1px solid var(--line);background:var(--surface-3);font-size:18px;cursor:pointer}
    .goal-number{font-size:18px;font-weight:800;min-width:96px;text-align:center}
    .goal-number span{font-size:11px;color:var(--muted);font-weight:500}

    .toast{
      position:fixed;z-index:50;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));
      transform:translate(-50%,14px);opacity:0;pointer-events:none;transition:all .2s ease;
      background:#18161b;border:1px solid var(--crimson);box-shadow:var(--shadow);color:#fff;
      padding:10px 15px;font-size:13px;font-weight:600;max-width:calc(100% - 32px);text-align:center;
    }
    .toast.show{opacity:1;transform:translate(-50%,0)}
    .hidden{display:none!important}

    @media(min-width:600px){
      body{padding:20px 0}
      .app{height:calc(100vh - 40px);height:calc(100dvh - 40px);border:1px solid rgba(255,255,255,.1);box-shadow:0 28px 90px rgba(0,0,0,.7)}
    }
    @media(max-width:360px){
      main{padding-left:14px;padding-right:14px}
      .topbar{padding-left:16px;padding-right:16px}
      .hero-art{width:118px;opacity:.75}
      .set-head,.set-row{grid-template-columns:28px minmax(60px,1fr) minmax(60px,1fr) 30px 24px;gap:4px}
      .input-wrap input{padding-left:8px;padding-right:22px}
    }
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
  </style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const STORAGE_KEY = 'replog-data-v1';

  const DEFAULT_ROUTINES = [
    {
      id: 'push',
      name: 'Push Day',
      tag: 'I · SPINTA',
      exercises: [
        'Pec deck',
        'Panca inclinata',
        'Alzate laterali macchina',
        'Shoulder press',
        'Shoulder press manubri',
        'Triceps push down',
        'Triceps overhead extension'
      ]
    },
    {
      id: 'pull',
      name: 'Pull Day',
      tag: 'II · TIRATA',
      exercises: [
        'Biceps curl',
        'Biceps preacher',
        'Lat machine',
        'Lat machine presa stretta',
        'T-bar row',
        'Biceps supino',
        'Addome cavo'
      ]
    },
    {
      id: 'legs',
      name: 'Leg Day',
      tag: 'III · GAMBE & AVAMBRACCI',
      exercises: [
        'Leg press (Squat)',
        'Leg extension',
        'Leg curl',
        'Polpacci in piedi',
        'Reverse curl',
        'Zottman curl'
      ]
    },
    {
      id: 'upper',
      name: 'Upper Day',
      tag: 'IV · UPPER COMPLETO',
      exercises: [
        'Pec deck',
        'Panca inclinata',
        'Lat machine',
        'Row presa stretta',
        'T-bar row',
        'Shoulder press',
        'Alzate laterali macchina',
        'Triceps push down',
        'Biceps preacher',
        'Biceps supino',
        'Addome cavo'
      ]
    }
  ];

  const MUSCLE_GROUPS = [
    { id: 'all', label: 'Generale', roman: 'TOT' },
    { id: 'petto', label: 'Petto', roman: 'I' },
    { id: 'schiena', label: 'Schiena', roman: 'II' },
    { id: 'spalle', label: 'Spalle', roman: 'III' },
    { id: 'tricipiti', label: 'Tricipiti', roman: 'IV' },
    { id: 'bicipiti', label: 'Bicipiti', roman: 'V' },
    { id: 'avambracci', label: 'Avambracci', roman: 'VI' },
    { id: 'gambe', label: 'Gambe', roman: 'VII' },
    { id: 'addome', label: 'Addome', roman: 'VIII' }
  ];

  const initial = {
    goal: 4,
    routines: DEFAULT_ROUTINES,
    history: [],
    exerciseGroups: {},
    screen: 'home',
    session: null
  };

  const ui = {
    homeRoutineId: null,
    muscle: 'all',
    exerciseFilter: 'all',
    metric: 'volume',
    chartPoint: null,
    editingRoutine: null,
    addingRoutine: false,
    restOpen: false,
    selectedExercise: null,
    exSearch: '',
    importTab: 'note', // note | manual
    manualRoutineId: 'push',
    manualDate: '',
    manualSets: {},
    noteText: '',
    parsedNoteSessions: null
  };

  const fresh = () => JSON.parse(JSON.stringify(initial));
  let state;
  try {
    state = { ...fresh(), ...JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}') };
  } catch {
    state = fresh();
  }
  if (!Array.isArray(state.routines) || !state.routines.length) state.routines = fresh().routines;
  if (!Array.isArray(state.history)) state.history = [];
  if (!state.exerciseGroups || typeof state.exerciseGroups !== 'object') state.exerciseGroups = {};

  // Migrazione automatica a Push / Pull / Leg(+Avambracci) / Upper
  let migrated = false;
  const pullR = state.routines.find(r => r.id === 'pull');
  if (pullR) {
    const before = pullR.exercises.length;
    pullR.exercises = pullR.exercises.filter(e => !/^(leg extension|leg curl|reverse curl)$/i.test(e.trim()));
    if (pullR.exercises.length !== before) migrated = true;
    pullR.tag = 'II · TIRATA';
  }
  let legsR = state.routines.find(r => r.id === 'legs');
  if (!legsR) {
    state.routines.push(JSON.parse(JSON.stringify(DEFAULT_ROUTINES[2])));
    migrated = true;
  } else {
    if (!legsR.exercises.some(e => /reverse curl/i.test(e))) { legsR.exercises.push('Reverse curl'); migrated = true; }
    if (!legsR.exercises.some(e => /zottman/i.test(e))) { legsR.exercises.push('Zottman curl'); migrated = true; }
    legsR.tag = 'III · GAMBE & AVAMBRACCI';
  }
  if (!state.routines.find(r => r.id === 'upper')) {
    state.routines.push(JSON.parse(JSON.stringify(DEFAULT_ROUTINES[3])));
    migrated = true;
  }

  const app = document.getElementById('app');
  const toastEl = document.getElementById('toast');
  let toastTimer;
  let restTimerInterval = null;
  let restSecondsLeft = 0;

  const esc = (s = '') => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => Math.random().toString(36).slice(2, 9);
  const save = () => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {} };
  if (migrated) save();

  const today = () => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  };
  ui.manualDate = today();

  const fmtDate = d => new Intl.DateTimeFormat('it-IT', { day: 'numeric', month: 'short' }).format(new Date((d || today()) + 'T12:00:00'));
  const fmtFullDate = d => new Intl.DateTimeFormat('it-IT', { weekday: 'long', day: 'numeric', month: 'long' }).format(new Date((d || today()) + 'T12:00:00'));
  const fmtNum = n => String(n ?? '').replace('.', ',');
  const fmtLoad = kg => kg == null || kg === '' ? 'corpo libero' : `${fmtNum(kg)} kg`;
  const toRoman = n => ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII'][n] || String(n + 1);

  function classifyExercise(name = '') {
    const key = name.trim().toLowerCase();
    if (state.exerciseGroups[key]) return state.exerciseGroups[key];
    if (/reverse curl|zottman|avambracc|wrist|forearm/.test(key)) return 'avambracci';
    if (/pec|peck|panca|chest|croci|fly|piegament/.test(key)) return 'petto';
    if (/alzate|shoulder|military|lento|deltoid|arnold/.test(key)) return 'spalle';
    if (/tricep|push.?down|overhead|french|skull/.test(key)) return 'tricipiti';
    if (/leg|squat|pressa|press|polpacc|calf|calves|affond|lunge|femoral|quad/.test(key)) return 'gambe';
    if (/lat|row|remator|pulley|trazion|pull.?up|chin.?up|dorso|stacco/.test(key)) return 'schiena';
    if (/bicep|curl|preacher|hammer|martello|scott/.test(key)) return 'bicipiti';
    if (/addom|abs|crunch|plank/.test(key)) return 'addome';
    return 'altro';
  }

  const repsChange = (current, previous) => {
    if (current === '' || previous == null || previous === '') return { cls: 'none', label: '' };
    const diff = Number(current) - Number(previous);
    if (diff > 0) return { cls: 'up', label: '+' + diff };
    if (diff < 0) return { cls: 'down', label: String(diff) };
    return { cls: 'same', label: '=' };
  };

  const recentSessions = () => [...state.history].sort((a, b) => (b.date + (b.finishedAt || '')).localeCompare(a.date + (a.finishedAt || '')));
  const chronoSessions = () => [...state.history].sort((a, b) => (a.date + (a.finishedAt || '')).localeCompare(b.date + (b.finishedAt || '')));
  const lastForRoutine = id => recentSessions().find(s => s.routineId === id);

  const lastForExercise = (name, skipSessionId = null) => {
    for (const session of recentSessions()) {
      if (skipSessionId && session.id === skipSessionId) continue;
      const ex = session.exercises.find(e => e.name.toLowerCase() === name.toLowerCase());
      if (ex && ex.sets?.length) return { ...ex, date: session.date };
    }
    return null;
  };

  const countThisWeek = () => {
    const now = new Date();
    const monday = new Date(now);
    monday.setHours(0, 0, 0, 0);
    monday.setDate(now.getDate() - ((now.getDay() + 6) % 7));
    return state.history.filter(s => new Date(s.date + 'T12:00:00') >= monday).length;
  };

  const totalVolume = () => state.history.reduce((sum, s) =>
    sum + s.exercises.reduce((sub, e) =>
      sub + e.sets.reduce((v, set) => v + (Number(set.kg) || 0) * (Number(set.reps) || 0), 0), 0), 0);

  function toast(message) {
    toastEl.textContent = message;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400);
  }

  function spartanHeroSvg() {
    return `<svg class="hero-art" viewBox="0 0 180 220" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M58 40C42 18 74 4 114 14C138 20 152 38 148 56C136 44 118 36 92 38C76 39 66 43 58 40Z" fill="#dc1f2e"/>
      <path d="M62 38C50 22 78 10 112 18C130 23 142 35 142 48" stroke="#ff6370" stroke-width="1.5" opacity=".7"/>
      <path d="M62 46C86 35 118 42 132 64C142 80 140 104 134 124L118 142L108 136L114 106L96 104L86 138L66 132C58 108 52 72 62 46Z" fill="#17161c" stroke="#d9d2c5" stroke-width="2"/>
      <path d="M60 88L92 92L98 118L84 136" stroke="#c9a96e" stroke-width="2"/>
      <path d="M66 80L94 84L86 92L64 89Z" fill="#070709" stroke="#d9d2c5" stroke-width="1.2"/>
      <path d="M98 48C112 52 122 64 124 84" stroke="#8a857e" stroke-width="1.2" stroke-dasharray="3 3"/>
      <path d="M40 162C56 144 82 140 112 146C136 150 154 166 164 205H28C30 186 34 170 40 162Z" fill="#111015" stroke="#dc1f2e" stroke-width="1.8"/>
      <path d="M42 165C64 156 96 158 122 178L108 205H30Z" fill="#7a0d17" opacity=".72"/>
      <path d="M144 90L148 195L144 205L140 195L144 90Z" fill="#f3efe6" opacity=".88"/>
      <path d="M133 176H155" stroke="#c9a96e" stroke-width="3"/>
    </svg>`;
  }

  function activeSessionBanner() {
    if (!state.session || state.screen === 'workout') return '';
    const savedCount = state.session.exercises.filter(e => e.saved).length;
    return `<div class="active-banner" data-action="resume-session" role="button" tabindex="0">
      <div class="active-banner-left">
        <span class="pulse-dot"></span>
        <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">IN CORSO: ${esc(state.session.routineName)} (${savedCount}/${state.session.exercises.length} salvati)</span>
      </div>
      <span class="active-banner-cta">Riprendi →</span>
    </div>`;
  }

  function header() {
    return `<header class="topbar">
      <div class="brand">
        <div class="brand-mark">R</div>
        <div>
          <div class="brand-name">REPLOG</div>
          <div class="brand-sub">Disciplina · Forza</div>
        </div>
      </div>
      <div class="avatar" aria-label="Profilo">FG</div>
    </header>${activeSessionBanner()}`;
  }

  function nav() {
    const activeNav = (state.screen === 'exercises' || state.screen === 'exercise-detail')
      ? 'routines'
      : (state.screen === 'import' ? 'progress' : state.screen);
    const items = [
      ['home', 'Home', `<svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5V21h-6v-6h-6v6H3z"/></svg>`],
      ['routines', 'Schede', `<svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>`],
      ['progress', 'Grafici', `<svg viewBox="0 0 24 24"><path d="M3 18l6-6 4 4 8-9M17 7h4v4"/></svg>`],
      ['profile', 'Profilo', `<svg viewBox="0 0 24 24"><path d="M12 3l7 4v10l-7 4-7-4V7z"/><circle cx="12" cy="12" r="2.5"/></svg>`]
    ];
    return `<nav class="tabbar" aria-label="Navigazione">
      ${items.map(([id, label, icon]) => `
        <button class="tab ${activeNav === id ? 'active' : ''}" data-nav="${id}" aria-label="${label}">
          ${icon}<span>${label}</span>
        </button>`).join('')}
    </nav>`;
  }

  function homeView() {
    const last = recentSessions()[0];
    const week = countThisWeek();
    let defaultIdx = 0;
    if (last) {
      const idx = state.routines.findIndex(r => r.id === last.routineId);
      if (idx >= 0) defaultIdx = (idx + 1) % state.routines.length;
    }
    const selIdx = ui.homeRoutineId ? state.routines.findIndex(r => r.id === ui.homeRoutineId) : defaultIdx;
    const activeIdx = selIdx >= 0 ? selIdx : 0;
    const routine = state.routines[activeIdx] || state.routines[0];
    const lastForSel = lastForRoutine(routine?.id);
    const nextSubtitle = lastForSel ? `Ultimo: ${fmtDate(lastForSel.date)}` : 'Pronta da iniziare';
    const totalSets = state.history.reduce((n, s) => n + s.exercises.reduce((v, e) => v + e.sets.length, 0), 0);

    return `${header()}<main>
      <section class="greeting">
        <div class="eyebrow">${esc(fmtFullDate(today()))}</div>
        <h1>Forgia i tuoi limiti</h1>
        <p class="muted">Scegli il giorno, registra le 2 serie e salva ogni esercizio al volo.</p>
      </section>

      <div class="day-switcher" aria-label="Scegli giorno">
        ${state.routines.map(r => `
          <button class="day-tab ${r.id === routine?.id ? 'active' : ''}" data-pick-home="${esc(r.id)}">
            ${esc(r.name.replace(/\s*day$/i, ''))}
          </button>`).join('')}
      </div>

      <section class="hero">
        ${spartanHeroSvg()}
        <div class="hero-content">
          <div class="hero-kicker">${esc(routine?.tag || 'SESSIONE')}</div>
          <h2>${esc(routine?.name || 'Allenamento')}</h2>
          <p class="hero-meta">${routine?.exercises.length || 0} esercizi · ${esc(nextSubtitle)}</p>
          <div class="hero-rule"><span>0${activeIdx + 1}</span><span class="bar"></span><span>0${state.routines.length}</span></div>
          <button class="hero-cta" data-start="${esc(routine?.id || 'push')}">
            ${state.session?.routineId === routine?.id ? 'Riprendi seduta' : 'Inizia ora'} <span aria-hidden="true">→</span>
          </button>
        </div>
      </section>

      <div class="section-head">
        <h2>Stato settimanale</h2>
        <button class="text-button" data-nav="progress">Grafici →</button>
      </div>
      <section class="stats">
        <div class="stat-card">
          <div class="stat-top"><span>Sedute</span><span class="stat-roman">I</span></div>
          <div class="stat-value">${week}<small> / ${state.goal}</small></div>
          <p class="tiny">obiettivo 7 giorni</p>
        </div>
        <div class="stat-card">
          <div class="stat-top"><span>Volume totale</span><span class="stat-roman">II</span></div>
          <div class="stat-value">${Math.round(totalVolume()).toLocaleString('it-IT')}<small> kg</small></div>
          <p class="tiny">${totalSets} serie registrate</p>
        </div>
      </section>

      <div class="section-head">
        <h2>Le tue schede</h2>
        <button class="text-button" data-action="open-exercises">Archivio Esercizi</button>
      </div>
      <section class="routine-list">
        ${state.routines.map((r, i) => `
          <article class="routine-card">
            <div class="routine-num">${toRoman(i)}</div>
            <div class="routine-info">
              <h3>${esc(r.name)}</h3>
              <p class="tiny">${r.exercises.length} esercizi${lastForRoutine(r.id) ? ` · ultimo ${fmtDate(lastForRoutine(r.id).date)}` : ''}</p>
            </div>
            <button class="arrow-button" data-start="${esc(r.id)}" aria-label="Inizia ${esc(r.name)}">→</button>
          </article>`).join('')}
      </section>

      ${last ? `<section class="last-session">
        <div class="last-main">
          <div class="eyebrow">Ultima seduta registrata</div>
          <strong>${esc(last.routineName)} · ${fmtDate(last.date)}</strong>
        </div>
        <div class="last-tag">SALVATA</div>
      </section>` : ''}
    </main>${nav()}`;
  }

  function routinesView() {
    return `${header()}<main>

  // IMPORTAZIONE VECCHI ALLENAMENTI + NOTE PARSER
  function parseNoteText(raw) {
    const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    const months = { gen: 1, gennaio: 1, feb: 2, febbraio: 2, mar: 3, marzo: 3, apr: 4, aprile: 4, mag: 5, maggio: 5, giu: 6, giugno: 6, lug: 7, luglio: 7, ago: 8, agosto: 8, set: 9, sett: 9, settembre: 9, ott: 10, ottobre: 10, nov: 11, novembre: 11, dic: 12, dicembre: 12 };
    const sessions = [];
    let current = null;

    const guessRoutine = text => {
      const t = text.toLowerCase();
      if (/upper/.test(t)) return { id: 'upper', name: 'Upper Day' };
      if (/leg|gambe/.test(t)) return { id: 'legs', name: 'Leg Day' };
      if (/pull|tirata|schiena/.test(t)) return { id: 'pull', name: 'Pull Day' };
      if (/push|spinta|petto/.test(t)) return { id: 'push', name: 'Push Day' };
      return null;
    };

    const parseDateFromLine = line => {
      let m = line.match(/\b(\d{4})-(\d{1,2})-(\d{1,2})\b/);
      if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
      m = line.match(/\b(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{2,4}))?\b/);
      if (m) {
        const day = m[1].padStart(2, '0');
        const mon = m[2].padStart(2, '0');
        let yr = m[3] ? (m[3].length === 2 ? '20' + m[3] : m[3]) : String(new Date().getFullYear());
        return `${yr}-${mon}-${day}`;
      }
      m = line.match(/\b(\d{1,2})\s+(gen(?:naio)?|feb(?:braio)?|mar(?:zo)?|apr(?:ile)?|mag(?:gio)?|giu(?:gno)?|lug(?:lio)?|ago(?:sto)?|sett?(?:embre)?|ott(?:obre)?|nov(?:embre)?|dic(?:embre)?)(?:\s+(\d{4}))?\b/i);
      if (m) {
        const day = m[1].padStart(2, '0');
        const mon = String(months[m[2].toLowerCase()] || 1).padStart(2, '0');
        const yr = m[3] || String(new Date().getFullYear());
        return `${yr}-${mon}-${day}`;
      }
      return null;
    };

    const parseSets = str => {
      const sets = [];
      // Pattern esplicito: 60x8, 60kg x 8, 60.5*10
      const pairRegex = /(\d+(?:[.,]\d+)?)\s*(?:kg)?\s*[x×*]\s*(\d+)/gi;
      let match;
      while ((match = pairRegex.exec(str)) !== null) {
        sets.push({ kg: Number(match[1].replace(',', '.')), reps: Number(match[2]) });
      }
      if (sets.length) {
        // Controlla se dopo l'ultimo match ci sono altre rep separate da virgola tipo "60x8, 7"
        const tail = str.slice(pairRegex.lastIndex);
        const extraReps = tail.match(/\b\d+\b/g);
        if (extraReps && sets.length === 1) {
          extraReps.forEach(r => sets.push({ kg: sets[0].kg, reps: Number(r) }));
        }
        return sets;
      }
      // Pattern: "60kg 8 8" o "60 kg: 10, 9"
      const kgLead = str.match(/^(\d+(?:[.,]\d+)?)\s*kg\b(.*)$/i);
      if (kgLead) {
        const kg = Number(kgLead[1].replace(',', '.'));
        const nums = (kgLead[2].match(/\d+/g) || []);
        nums.forEach(r => sets.push({ kg, reps: Number(r) }));
        if (sets.length) return sets;
      }
      // Solo ripetizioni (corpo libero): "15, 14"
      const plainNums = str.match(/\b\d+\b/g);
      if (plainNums && plainNums.length <= 6) {
        plainNums.forEach(r => sets.push({ kg: null, reps: Number(r) }));
      }
      return sets;
    };

    for (const line of lines) {
      const foundDate = parseDateFromLine(line);
      const foundRoutine = guessRoutine(line);

      // Se la riga ha una data o è un'intestazione pura di scheda senza numeri di serie
      const hasSetsNumbers = /\d+\s*[x×*]\s*\d+|\d+\s*kg|\:\s*\d+/i.test(line);
      if (foundDate || (foundRoutine && !hasSetsNumbers)) {
        const r = foundRoutine || { id: 'custom', name: 'Allenamento' };
        current = {
          id: 'imp-' + uid(),
          routineId: r.id,
          routineName: r.name,
          date: foundDate || today(),
          finishedAt: new Date().toISOString(),
          exercises: []
        };
        sessions.push(current);
        continue;
      }

      // Riga esercizio: trova dove iniziano i numeri/carichi
      const splitIdx = line.search(/[:\-–]?\s*\d+(?:[.,]\d+)?\s*(?:kg|[x×*]|$|\s+\d+)/i);
      const colonIdx = line.indexOf(':');
      let name = '', rest = '';
      if (colonIdx > 1) {
        name = line.slice(0, colonIdx).trim();
        rest = line.slice(colonIdx + 1).trim();
      } else {
        const numStart = line.search(/\s\d+(?:[.,]\d+)?(?:\s*(?:kg|[x×*])|\s+\d|$)/i);
        if (numStart > 1) {
          name = line.slice(0, numStart).replace(/[-–:]+$/, '').trim();
          rest = line.slice(numStart).trim();
        }
      }

      if (name && rest) {
        const sets = parseSets(rest);
        if (sets.length) {
          if (!current) {
            current = { id: 'imp-' + uid(), routineId: 'custom', routineName: 'Allenamento', date: today(), finishedAt: new Date().toISOString(), exercises: [] };
            sessions.push(current);
          }
          current.exercises.push({ name, sets });
        }
      }
    }
    return sessions.filter(s => s.exercises.length > 0);
  }

              <label class="input-wrap reps-input"><input type="number" inputmode="numeric" step="1" value="${esc(val[0].reps)}" data-m-ex="${esc(name)}" data-m-set="0" data-m-field="reps"><span class="input-unit">rep</span></label>

              <label class="input-wrap weight-input"><input type="number" inputmode="decimal" step="0.5" value="${esc(val[1].kg)}" data-m-ex="${esc(name)}" data-m-set="1" data-m-field="kg"><span class="input-unit">kg</span></label>
              <label class="input-wrap reps-input"><input type="number" inputmode="numeric" step="1" value="${esc(val[1].reps)}" data-m-ex="${esc(name)}" data-m-set="1" data-m-field="reps"><span class="input-unit">rep</span></label>

  // GRAFICI
  function buildSeriesData(muscleFilter, exerciseFilter, metric) {
    const sessions = chronoSessions();
    const points = [];
    for (const s of sessions) {
      const matchingEx = s.exercises.filter(ex => {
        const grp = classifyExercise(ex.name);
        if (muscleFilter !== 'all' && grp !== muscleFilter) return false;
        if (exerciseFilter !== 'all' && ex.name.toLowerCase() !== exerciseFilter.toLowerCase()) return false;
        return true;
      });
      if (!matchingEx.length) continue;

      let value = 0, totalReps = 0, totalVol = 0, maxKg = 0, max1RM = 0, bestSetText = '', setsCount = 0;
      for (const ex of matchingEx) {
        for (const set of ex.sets) {
          const kg = Number(set.kg) || 0;
          const reps = Number(set.reps) || 0;
          setsCount++; totalReps += reps; totalVol += kg * reps;
          if (kg > maxKg) maxKg = kg;
          const e1rm = kg > 0 ? kg * (1 + reps / 30) : reps;
          if (e1rm >= max1RM) { max1RM = e1rm; bestSetText = `${ex.name}: ${fmtLoad(set.kg)} × ${reps}`; }
        }
      }
      if (metric === 'volume') value = Math.round(totalVol);
      else if (metric === 'maxKg') value = Number(maxKg.toFixed(1));
      else if (metric === 'e1rm') value = Math.round(max1RM);
      else if (metric === 'reps') value = totalReps;

      points.push({ date: s.date, routineName: s.routineName, value, totalReps, setsCount, bestSetText });
    }
    return points;
  }

  function renderChartSvg(points) {
    if (!points.length) return '';
    const W = 340, H = 165, padL = 34, padR = 12, padT = 16, padB = 26;
    const innerW = W - padL - padR, innerH = H - padT - padB;
    const vals = points.map(p => p.value);
    let minV = Math.min(...vals), maxV = Math.max(...vals);
    if (minV === maxV) { minV = Math.max(0, minV * 0.8); maxV = maxV === 0 ? 10 : maxV * 1.2; }
    else { const span = maxV - minV; minV = Math.max(0, minV - span * 0.12); maxV = maxV + span * 0.12; }

    const coords = points.map((p, i) => ({
      x: points.length === 1 ? padL + innerW / 2 : padL + (i / (points.length - 1)) * innerW,
      y: padT + innerH - ((p.value - minV) / (maxV - minV)) * innerH,
      p, i
    }));
    const linePts = coords.map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(' ');
    const areaPath = coords.length > 1
      ? `M ${coords[0].x.toFixed(1)},${(padT + innerH).toFixed(1)} L ${coords.map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(' L ')} L ${coords[coords.length - 1].x.toFixed(1)},${(padT + innerH).toFixed(1)} Z`
      : '';
    const selectedIdx = (ui.chartPoint != null && ui.chartPoint < points.length) ? ui.chartPoint : points.length - 1;

    return `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafico andamento">
      <defs>
        <linearGradient id="crimsonArea" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#dc1f2e" stop-opacity="0.38"/>
          <stop offset="100%" stop-color="#dc1f2e" stop-opacity="0.0"/>
        </linearGradient>
      </defs>
      ${[0, 0.5, 1].map(t => {
        const y = padT + innerH * (1 - t);
        return `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="rgba(255,255,255,0.07)" stroke-dasharray="3 3"/>
                <text x="${padL - 6}" y="${y + 3}" text-anchor="end" fill="#7c7770" font-size="9" font-weight="600">${Math.round(minV + (maxV - minV) * t)}</text>`;
      }).join('')}
      ${areaPath ? `<path d="${areaPath}" fill="url(#crimsonArea)"/>` : ''}
      ${coords.length > 1 ? `<polyline points="${linePts}" fill="none" stroke="#ff2d3d" stroke-width="2.4" stroke-linejoin="miter"/>` : ''}
      ${coords.map(c => {
        const isSel = c.i === selectedIdx;
        return `<g data-chart-pt="${c.i}" style="cursor:pointer">
          ${isSel ? `<line x1="${c.x}" y1="${padT}" x2="${c.x}" y2="${padT + innerH}" stroke="rgba(201,169,110,0.45)" stroke-dasharray="2 2"/>` : ''}
          <circle cx="${c.x}" cy="${c.y}" r="14" fill="transparent"/>
          <polygon points="${c.x},${c.y - (isSel ? 6 : 4.5)} ${c.x + (isSel ? 6 : 4.5)},${c.y} ${c.x},${c.y + (isSel ? 6 : 4.5)} ${c.x - (isSel ? 6 : 4.5)},${c.y}"
            fill="${isSel ? '#f3efe6' : '#0b0b0e'}" stroke="#ff2d3d" stroke-width="${isSel ? 2.5 : 2}"/>
        </g>`;
      }).join('')}
      ${coords.map((c, idx) => (points.length <= 6 || idx === 0 || idx === points.length - 1 || idx === Math.floor(points.length / 2))
        ? `<text x="${c.x}" y="${H - 6}" text-anchor="middle" fill="#8a857e" font-size="9" font-weight="600">${esc(fmtDate(c.p.date))}</text>`
        : '').join('')}
    </svg>`;
  }

  function progressView() {
    const sessions = recentSessions();
    const hasDemo = state.history.some(s => s.isDemo);

    const exerciseSet = new Set();
    state.history.forEach(s => s.exercises.forEach(ex => {
      if (ui.muscle === 'all' || classifyExercise(ex.name) === ui.muscle) exerciseSet.add(ex.name);
    }));
    const availableExercises = [...exerciseSet].sort();
    if (ui.exerciseFilter !== 'all' && !availableExercises.some(e => e.toLowerCase() === ui.exerciseFilter.toLowerCase())) {
      ui.exerciseFilter = 'all';
    }

    const points = buildSeriesData(ui.muscle, ui.exerciseFilter, ui.metric);
    const metricInfo = {
      volume: { label: 'Volume (kg × reps)', unit: 'kg' },
      maxKg: { label: 'Carico Massimo', unit: 'kg' },
      e1rm: { label: '1RM Stimato', unit: 'kg' },
      reps: { label: 'Ripetizioni Totali', unit: 'rep' }
    }[ui.metric];

    const latest = points[points.length - 1], first = points[0];
    let deltaPct = null;
    if (points.length >= 2 && first.value > 0) deltaPct = Math.round(((latest.value - first.value) / first.value) * 100);
    const selIdx = (ui.chartPoint != null && ui.chartPoint < points.length) ? ui.chartPoint : points.length - 1;
    const selPoint = points[selIdx];

    const groupTotals = {};
    MUSCLE_GROUPS.filter(g => g.id !== 'all').forEach(g => groupTotals[g.id] = { label: g.label, vol: 0, sets: 0 });
    state.history.forEach(s => s.exercises.forEach(ex => {
      const g = classifyExercise(ex.name);
      if (groupTotals[g]) ex.sets.forEach(set => {
        groupTotals[g].sets++;
        groupTotals[g].vol += (Number(set.kg) || 0) * (Number(set.reps) || 0);
      });
    }));
    const groupList = Object.values(groupTotals).filter(g => g.sets > 0).sort((a, b) => b.vol - a.vol);

    const bests = {};
    state.history.forEach(s => s.exercises.forEach(ex => {
      if (ui.muscle !== 'all' && classifyExercise(ex.name) !== ui.muscle) return;
      ex.sets.forEach(set => {
        const kg = Number(set.kg) || 0, reps = Number(set.reps) || 0;
        const score = kg > 0 ? kg * (1 + reps / 30) : reps;
        if (!bests[ex.name] || kg > bests[ex.name].kg || (kg === bests[ex.name].kg && reps > bests[ex.name].reps)) {
          bests[ex.name] = { kg, reps, date: s.date, e1rm: Math.round(score) };

    return `${header()}<main>
      <section class="page-title">
        <div>
          <div class="eyebrow">Analisi &amp; Progressioni</div>
          <h1>Grafici</h1>
        </div>
        <button class="secondary-button small-btn" data-action="open-import">＋ Carica note</button>
      </section>

      ${state.history.length === 0 ? `
        <div class="empty-state" style="margin-bottom:14px">
          <div class="empty-icon">I</div>
          <h3>Ancora nessun dato registrato</h3>
          <p class="tiny" style="margin:6px 0 14px">Puoi caricare i tuoi 2 mesi di allenamenti dalle tue note oppure fare una prova rapida con dati simulati.</p>
          <div class="button-row" style="justify-content:center;flex-wrap:wrap">
            <button class="primary-button" data-action="open-import">Importa da Note</button>
            <button class="secondary-button" data-action="load-demo">Dati di prova</button>
          </div>
        </div>` : ''}

      ${hasDemo ? `
        <div class="note-card" style="display:flex;justify-content:space-between;align-items:center;gap:10px">
          <span>Stai visualizzando dati di prova.</span>
          <button class="danger-button small-btn" data-action="clear-demo">Rimuovi demo</button>
        </div>` : ''}

      <div class="filter-scroll" role="tablist" aria-label="Filtro gruppo muscolare">
        ${MUSCLE_GROUPS.map(g => `
          <button class="filter-chip ${ui.muscle === g.id ? 'active' : ''}" data-muscle="${g.id}">
            <span class="roman">${g.roman}</span> ${esc(g.label)}
          </button>`).join('')}
      </div>

      ${availableExercises.length > 1 ? `
        <div style="margin-bottom:10px">
          <select class="form-select" id="exercise-filter" aria-label="Filtra per esercizio">
            <option value="all">Tutti gli esercizi (${esc(MUSCLE_GROUPS.find(m => m.id === ui.muscle)?.label || '')})</option>
            ${availableExercises.map(name => `<option value="${esc(name)}" ${ui.exerciseFilter === name ? 'selected' : ''}>${esc(name)}</option>`).join('')}
          </select>
        </div>` : ''}

      <div class="metric-tabs">
        <button class="metric-btn ${ui.metric === 'volume' ? 'active' : ''}" data-metric="volume">Volume</button>
        <button class="metric-btn ${ui.metric === 'maxKg' ? 'active' : ''}" data-metric="maxKg">Max Kg</button>
        <button class="metric-btn ${ui.metric === 'e1rm' ? 'active' : ''}" data-metric="e1rm">1RM Stima</button>
        <button class="metric-btn ${ui.metric === 'reps' ? 'active' : ''}" data-metric="reps">Reps</button>
      </div>

      <section class="chart-box">
        <div class="chart-header">
          <div>
            <div class="eyebrow">${esc(metricInfo.label)}</div>
            <div class="chart-big">${latest ? `${latest.value.toLocaleString('it-IT')} <small>${metricInfo.unit}</small>` : '—'}</div>
          </div>
          ${deltaPct !== null ? `<span class="trend-badge ${deltaPct > 0 ? 'up' : deltaPct < 0 ? 'down' : 'flat'}">${deltaPct > 0 ? '+' : ''}${deltaPct}%</span>` : ''}
        </div>
        ${points.length ? `
          ${renderChartSvg(points)}
          ${selPoint ? `<div class="chart-readout">
            <div>
              <div class="eyebrow" style="font-size:9px">${esc(fmtFullDate(selPoint.date))}</div>
              <strong>${esc(selPoint.bestSetText || selPoint.routineName)}</strong>
            </div>
            <div style="text-align:right;white-space:nowrap">
              <strong style="color:var(--crimson-bright)">${selPoint.value.toLocaleString('it-IT')} ${metricInfo.unit}</strong>
              <div class="tiny">${selPoint.setsCount} serie · ${selPoint.totalReps} rep</div>
            </div>
          </div>` : ''}
        ` : `<p class="tiny" style="padding:18px 0;text-align:center">Nessuna seduta trovata per questo filtro.</p>`}
      </section>

      ${ui.muscle === 'all' && groupList.length ? `
        <div class="section-head"><h2>Ripartizione Muscolare</h2></div>
        <section class="muscle-bars">
          ${groupList.map(g => `
            <div class="mbar-row">
              <div class="mbar-top"><strong>${esc(g.label)}</strong><span class="tiny">${Math.round(g.vol).toLocaleString('it-IT')} kg · ${g.sets} serie</span></div>
              <div class="mbar-track"><div class="mbar-fill" style="width:${Math.max(6, Math.round((g.vol / maxGroupVol) * 100))}%"></div></div>
            </div>`).join('')}
        </section>` : ''}

      <div class="section-head">
        <h2>Record Personali</h2>
        <button class="text-button" data-action="open-exercises">Modifica carichi →</button>
      </div>
      ${bestEntries.length ? `
        <section class="record-list">
          ${bestEntries.map(([name, b]) => `
            <div class="record-row" data-open-ex="${esc(name)}">
              <div>
                <div style="font-weight:700;font-size:14px">${esc(name)}</div>
                <div class="tiny">${fmtDate(b.date)} · ${b.reps} reps · 1RM ${b.e1rm} kg</div>
              </div>
              <strong>${b.kg > 0 ? `${fmtNum(b.kg)} kg` : `${b.reps} rep`}</strong>
            </div>`).join('')}
        </section>` : `<div class="empty-state"><p class="tiny">Tocca un esercizio qui per vederne i record.</p></div>`}

      <div class="section-head">
        <h2>Storico Sedute (${sessions.length})</h2>
        <button class="text-button" data-action="open-import">＋ Passate</button>
      </div>
      ${sessions.length ? sessions.slice(0, 25).map(s => `
        <article class="history-card">
          <div class="history-top">
            <strong>${esc(s.routineName)}</strong>
            <div style="display:flex;align-items:center;gap:10px">
              <span class="history-date">${fmtDate(s.date)}</span>
              <button class="chip-del" data-delete-session="${esc(s.id)}" aria-label="Elimina seduta">×</button>
            </div>
          </div>
          <div class="history-detail">${s.exercises.map(e => `${esc(e.name)}: ${e.sets.map(set => `${fmtLoad(set.kg)}×${set.reps}`).join(', ')}`).join(' · ')}</div>
        </article>`).join('') : `<div class="empty-state"><p class="tiny">Nessun allenamento salvato.</p></div>`}
    </main>${nav()}`;
  }

  function profileView() {
    const hasDemo = state.history.some(s => s.isDemo);
    return `${header()}<main>
      <section class="page-title">
        <div>
          <div class="eyebrow">Preferenze &amp; Storico</div>

        </div>
        <div class="avatar">FG</div>
      </section>

      <section class="profile-card">
